<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animations — Théorie Harmonique Universelle</title>
  <meta name="description" content="Les animations de la Théorie Harmonique Universelle : l'onde primordiale Ψ₁, l'émergence totale n=0→7, l'Ouroboros, la gravité." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theater-body">

  <div class="grain" aria-hidden="true"></div>

  <header class="nav nav--scrolled" id="nav">
    <a class="nav__brand" href="index.html">
      <span class="nav__sigil" aria-hidden="true">Ψ</span>
      <span class="nav__title">Théorie Harmonique</span>
    </a>
    <nav class="nav__links" aria-label="Navigation">
      <a href="index.html">← Retour au site</a>
      <a href="bibliotheque.html">Bibliothèque</a>
    </nav>
  </header>

  <main class="theater">
    <!-- Sélecteur d'animations -->
    <aside class="theater__sidebar" aria-label="Liste des animations">
      <span class="badge">Innovation majeure</span>
      <p class="section-kicker">Animations</p>
      <p class="theater__hint">Choisissez une scène.</p>
      <nav class="theater__list" id="animList"></nav>
    </aside>

    <!-- Scène -->
    <section class="theater__stage">
      <canvas class="theater__canvas" id="stage"></canvas>

      <div class="stage__head">
        <div class="stage__title" id="stageTitle">L'Onde Primordiale</div>
        <div class="stage__tag" id="stageTag"></div>
      </div>
      <div class="stage__sub" id="stageSub"></div>
      <div class="stage__level" id="stageLevel">n=1</div>
      <div class="stage__overlay" id="stageOverlay"></div>

      <div class="stage__progress"><div class="stage__progress-fill" id="progressFill"></div></div>

      <div class="stage__controls" id="stageControls">
        <button class="ctrl" id="btnPlay" aria-label="Lecture">▶</button>
        <button class="ctrl" id="btnPause" aria-label="Pause">⏸</button>
        <button class="ctrl" id="btnReset" aria-label="Réinitialiser">↺</button>
        <label class="ctrl ctrl--speed">
          <span>vitesse</span>
          <input type="range" id="speed" min="1" max="40" value="10" />
          <span id="speedVal" class="ctrl__val">10×</span>
        </label>
        <label class="ctrl ctrl--mass" id="massCtrl" hidden>
          <span>masse</span>
          <input type="range" id="mass" min="0" max="100" value="30" />
          <span id="massVal" class="ctrl__val">30%</span>
        </label>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="animations.js"></script>
  <script src="theater.js"></script>
</body>
</html>
