<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console — Harmonic AI Finance</title>
  <meta name="description" content="Console d'analyse harmonique : prompts réglementaires et risque, réponses sourcées avec confiance ±, refus anti-hallucination." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="grain" aria-hidden="true"></div>

  <main class="console">
    <!-- Barre latérale -->
    <aside class="console__side">
      <a class="nav__brand" href="index.html">
        <span class="nav__sigil" aria-hidden="true">Ψ</span>
        <span class="nav__title">Harmonic AI Finance</span>
      </a>

      <div>
        <p class="console__label">Scénarios de démonstration</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
          <button class="sug" data-q="Quelles sont les exigences de reporting MiFID II pour les produits dérivés sur actions européennes ? Citez les articles spécifiques du règlement.">
            <span><span class="sug__tag">Compliance</span>Reporting MiFID II — produits dérivés</span>
          </button>
          <button class="sug" data-q="Calculez la Value at Risk (VaR) à 95% pour un portefeuille : valeur $10M, volatilité 18%, corrélation marché 0.75. Fournissez les formules et hypothèses.">
            <span><span class="sug__tag">Risk</span>VaR 95 % — portefeuille $10M</span>
          </button>
          <button class="sug" data-q="Quelle est la meilleure recette de tarte aux pommes ?">
            <span><span class="sug__tag">Anti-hallucination</span>Prompt hors base → refus</span>
          </button>
        </div>
      </div>

      <div>
        <p class="console__label">Historique</p>
        <div class="history" id="history"></div>
      </div>

      <div class="console__actions">
        <button class="btn btn--wave" id="btnExport" style="width:100%">Exporter les sessions</button>
        <button class="btn btn--ghost" id="btnClear" style="width:100%">Effacer l'historique</button>
      </div>
    </aside>

    <!-- Zone de chat -->
    <section class="console__main">
      <div class="chat" id="chat">
        <div class="chat__empty" id="emptyState">
          <span class="chat__empty-sigil" aria-hidden="true">∿</span>
          <p>Posez une question de conformité ou de risque.<br />Le moteur harmonique répond — ou refuse.</p>
        </div>
      </div>

      <form class="inputbar" id="form">
        <textarea id="input" rows="2" placeholder="Ex. : Quelles sont les exigences de reporting MiFID II pour les produits dérivés ?"></textarea>
        <button class="btn btn--gold" type="submit" id="send">Résonner →</button>
      </form>
    </section>
  </main>

  <script src="knowledge.js"></script>
  <script src="engine.js"></script>
  <script src="eval.js"></script>
  <script src="app.js"></script>
</body>
</html>
