<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🌊 Émergence — n=0 → n=7</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fafafa;font-family:Inter,system-ui,sans-serif;overflow:hidden;height:100vh}canvas{display:block}#info{position:absolute;top:8px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}#title{font-size:16px;font-weight:700}#subtitle{font-size:10px;color:#a1a1aa;margin-top:1px}#level{position:absolute;top:8px;right:16px;font-size:40px;font-weight:800;color:rgba(245,158,11,.5);z-index:10;pointer-events:none}#ui{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;align-items:center}button{padding:6px 12px;border-radius:4px;border:1px solid #333;background:#111;color:#ccc;font-size:10px;cursor:pointer}button:hover{border-color:#f59e0b;background:#1a1a1a;color:#fff}button.active{background:#f59e0b;border-color:#f59e0b;color:#000;font-weight:600}#speedVal{color:#f59e0b;font-size:10px;min-width:20px}input[type=range]{width:80px}</style></head><body>
<div id="info"><div id="title">🌊 Émergence — de la Lumière à la Conscience</div><div id="subtitle">n=0 → n=7 · Ψ = Σ Hₙ·(Ψ₁)ⁿ</div></div>
<div id="level">n=0</div>
<canvas id="c"></canvas>
<div id="ui">
  <button id="btn-play" class="active" onclick="playing=!0;this.classList.add('active');document.getElementById('btn-pause').classList.remove('active')">▶</button>
  <button id="btn-pause" onclick="playing=!1;this.classList.add('active');document.getElementById('btn-play').classList.remove('active')">⏸</button>
  <button id="btn-reset" onclick="t=0;playing=!0;document.getElementById('btn-play').classList.add('active');document.getElementById('btn-pause').classList.remove('active')">↺</button>
  <span style="color:#555;font-size:10px">| Vitesse:</span>
  <input type="range" id="speed" min="2" max="40" value="12" oninput="spd=parseInt(this.value)">
  <span id="speedVal">12x</span>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,cx,cy,t=0,playing=!0,spd=12;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;cx=W/2;cy=H/2}resize();addEventListener('resize',resize);
function a(t0,dur){const x=(t-t0)/dur;return Math.min(1,Math.max(0,x))}

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const T=t,TOTAL=65,n0=a(0,4),n1=a(3,6),n2=a(8,8),n3=a(15,10),n4=a(24,12),n5=a(35,12),n6=a(46,14),n7=a(59,10);
  let lvl='0',sub='';

  // ═══ n=0 : ∅ (0-4s) ═══
  if(n0>.01){
    lvl='0';sub='∅ Le vide — ni espace, ni temps, ni lumière.';
    if(n0>.3){const g=ctx.createRadialGradient(cx,cy,0,cx,cy,3+n0*5);g.addColorStop(0,'rgba(245,158,11,.1)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,3+n0*5,0,Math.PI*2);ctx.fill()}
  }
  // ═══ n=1 : Ψ₁ (3-9s) ═══
  if(n1>.01){
    lvl='1';sub='🌊 Ψ₁ — la première vibration. Elle n\'est NULLE PART.';
    for(let i=0;i<120;i++){const a=Math.random()*Math.PI*2,d=20+Math.random()*80*n1,x=cx+d*Math.cos(a),y=cy+d*Math.sin(a);
      const w=.4+.4*Math.sin(d*.06-T*.08);const alpha=n1*w*.4;if(alpha<.01)continue;
      ctx.fillStyle=`rgba(245,200,80,${alpha})`;ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle=`rgba(245,200,80,${n1*.6})`;ctx.font='14px Inter,sans-serif';ctx.textAlign='center';ctx.fillText('Ψ₁',cx,cy-30);
  }
  // ═══ n=2 : Gravité (8-16s) ═══
  if(n2>.01){
    lvl='2';sub='🔻 Gravité — D^{1/φ}[Ψ]=G[Ψ]. Le couplage crée l\'espace.';
    const sep=n2*200;const x1=cx-sep/2,y1=cy,x2=cx+sep/2,y2=cy;
    // Traînées ABC (ambre)
    for(const [sx,sy] of[[x1,y1],[x2,y2]]){for(let i=0;i<30;i++){const delay=i*.08;const phi=1.618;const decay=Math.exp(-phi*delay);
      const alpha=n2*decay*.5;if(alpha<.01)continue;const ta=T*.5+i*.3;const tx=sx+(8+decay*30)*Math.cos(ta),ty=sy+(8+decay*30)*Math.sin(ta);
      ctx.fillStyle=`rgba(245,200,80,${alpha})`;ctx.beginPath();ctx.arc(tx,ty,1.5,0,Math.PI*2);ctx.fill()}}
    // Grille Oyibo (violet)
    if(sep>20){const gridAlpha=n2*.3;for(let gx=cx-150;gx<=cx+150;gx+=25){ctx.strokeStyle=`rgba(139,92,246,${gridAlpha*.4})`;ctx.beginPath();
      for(let y=cy-100;y<=cy+100;y+=3){const wx=gx+(1/1.618)*25*Math.exp(-Math.abs(gx-cx)/150)*Math.sin(gx*.03+T*.2);ctx.lineTo(wx,y)}ctx.stroke()}}
    // Ligne de couplage
    if(sep>10){const pulse=.5+.5*Math.sin(T*3);ctx.strokeStyle=`rgba(255,255,255,${n2*(.2+pulse*.3)})`;ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
    // Masses
    for(const [x,y] of[[x1,y1],[x2,y2]]){const g=ctx.createRadialGradient(x,y,2,x,y,15);g.addColorStop(0,'#fff');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill()}
    if(n2>.5&&sep>80){ctx.fillStyle=`rgba(255,255,255,${n2*.7})`;ctx.font='11px Inter,sans-serif';ctx.textAlign='center';ctx.fillText('D^{1/φ}[Ψ]=G[Ψ]',cx,cy-15)}
  }
  // ═══ n=3 : Lumière (15-25s) ═══
  if(n3>.01){
    lvl='3';sub='💡 Lumière — le couplage se propage à c.';
    const r=80+Math.sin(T*.3)*20;
    for(let i=0;i<8;i++){const a=i*Math.PI/4;const sx=cx+r*Math.cos(a),sy=cy+r*Math.sin(a);const alpha=n3*.4*Math.exp(-Math.abs(a-Math.PI/2)/3);
      ctx.fillStyle=`rgba(245,200,80,${alpha})`;ctx.beginPath();ctx.arc(sx,sy,5,0,Math.PI*2);ctx.fill()}
    // Ondes lumineuses
    for(let ring=0;ring<4;ring++){const age=(T*spd/8*.2+ring*.5)%2;if(age>.05){const rr=30+age*120;const ra=(1-age/2)*.25*n3;ctx.strokeStyle=`rgba(245,200,80,${ra})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.stroke()}}
    const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,15);cg.addColorStop(0,'#fff');cg.addColorStop(.5,'rgba(245,200,80,.4)');cg.addColorStop(1,'transparent');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,15,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(255,255,255,${n3*.7})`;ctx.font='11px Inter,sans-serif';ctx.textAlign='center';ctx.fillText('c = vitesse du couplage',cx,cy+50);
  }
  // ═══ n=4 : Matière / Atomes (24-36s) ═══
  if(n4>.01){
    lvl='4';sub='⚛️ Matière — atomes, force EM.';
    const or=80+20*Math.sin(T*.2);const eA=T*.6;const ex=cx+or*Math.cos(eA),ey=cy+or*Math.sin(eA);
    // Noeuds d'interférence (atomes)
    for(let i=0;i<5;i++){const ia=i*Math.PI*2/5+1;const ax=cx+or*.7*Math.cos(ia),ay=cy+or*.5*Math.sin(ia);
      const ag=ctx.createRadialGradient(ax,ay,2,ax,ay,8);ag.addColorStop(0,'#fff');ag.addColorStop(1,'transparent');ctx.fillStyle=ag;ctx.beginPath();ctx.arc(ax,ay,8,0,Math.PI*2);ctx.fill()}
    // Proton + Électron
    const pg=ctx.createRadialGradient(cx,cy,2,cx,cy,12);pg.addColorStop(0,'#fff');pg.addColorStop(.4,'rgba(245,200,80,.4)');pg.addColorStop(1,'transparent');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(cx,cy,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,2.5,0,Math.PI*2);ctx.fill();
    const eg=ctx.createRadialGradient(ex,ey,1,ex,ey,8);eg.addColorStop(0,'#fff');eg.addColorStop(.4,'rgba(34,211,238,.4)');eg.addColorStop(1,'transparent');ctx.fillStyle=eg;ctx.beginPath();ctx.arc(ex,ey,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,1.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(139,92,246,.2)';ctx.setLineDash([3,5]);ctx.beginPath();ctx.arc(cx,cy,or,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  }
  // ═══ n=5 : Forces nucléaires (35-47s) ═══
  if(n5>.01){
    lvl='5';sub='🟢🔴 Forces — forte (triangle) et faible (réarrangement).';
    const r=60+20*Math.sin(T*.15);const qp=[{x:cx,y:cy-r},{x:cx-r*.866,y:cy+r*.5},{x:cx+r*.866,y:cy+r*.5}];
    ctx.strokeStyle=`rgba(239,68,68,${n5*.3})`;ctx.lineWidth=1.5;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(qp[0].x,qp[0].y);ctx.lineTo(qp[1].x,qp[1].y);ctx.lineTo(qp[2].x,qp[2].y);ctx.closePath();ctx.stroke();ctx.setLineDash([]);
    for(let i=0;i<3;i++){const qg=ctx.createRadialGradient(qp[i].x,qp[i].y,2,qp[i].x,qp[i].y,10);qg.addColorStop(0,'#fff');qg.addColorStop(1,'transparent');ctx.fillStyle=qg;ctx.beginPath();ctx.arc(qp[i].x,qp[i].y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(qp[i].x,qp[i].y,2,0,Math.PI*2);ctx.fill()}
    // Weak force flash
    const decay=(T%18)/18;if(decay>.4&&decay<.6){const fa=(1-Math.abs(decay-.5)*10)*.5;const fg=ctx.createRadialGradient(qp[1].x,qp[1].y,0,qp[1].x,qp[1].y,25);fg.addColorStop(0,`rgba(34,197,94,${fa})`);fg.addColorStop(1,'transparent');ctx.fillStyle=fg;ctx.beginPath();ctx.arc(qp[1].x,qp[1].y,25,0,Math.PI*2);ctx.fill()}
  }
  // ═══ n=6 : Vie (46-60s) ═══
  if(n6>.01){
    lvl='6';sub='🧬 Vie — ADN, double hélice = deux ondes couplées.';
    const helixAmp=40;for(let i=0;i<2;i++){const ph=(i===0?0:Math.PI);
      ctx.strokeStyle=i===0?`rgba(59,130,246,${n6*.5})`:`rgba(239,68,68,${n6*.5})`;ctx.lineWidth=2;ctx.beginPath();
      for(let y=0;y<H*1.2;y+=4){const ny=cy-H*.6+y;const angle=y*.03+T*.1+ph;ctx.lineTo(cx+helixAmp*Math.cos(angle),ny)}ctx.stroke()}
    // Barres de liaison
    for(let y=0;y<H*1.2;y+=30){const ny=cy-H*.6+y;const a1=y*.03+T*.1,a2=a1+Math.PI;const x1=cx+helixAmp*Math.cos(a1),x2=cx+helixAmp*Math.cos(a2);
      ctx.strokeStyle=`rgba(245,200,80,${n6*.3})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,ny);ctx.lineTo(x2,ny);ctx.stroke()}
  }
  // ═══ n=7 : Conscience (59-70s) ═══
  if(n7>.01){
    lvl='7';sub='💫 Conscience — l\'onde qui se voit elle-même.';
    const cr=30+n7*80;for(let i=0;i<3;i++){const ph=i*Math.PI*2/3;const sr=15+n7*15;
      ctx.strokeStyle=`rgba(${i===0?245:i===1?139:34},${i===0?200:i===1?92:211},${i===0?80:i===1?246:238},${n7*.4})`;ctx.lineWidth=1.5;ctx.setLineDash([2,4]);ctx.beginPath();ctx.arc(cx,cy,sr,ph,ph+Math.PI);ctx.stroke();ctx.setLineDash([])}
    // Œil central (l'onde qui se réfléchit)
    const eyeR=8+n7*15;ctx.strokeStyle=`rgba(255,255,255,${n7*.7})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,eyeR,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=`rgba(255,255,255,${n7*.9})`;ctx.beginPath();ctx.arc(cx,cy,3+n7*2,0,Math.PI*2);ctx.fill();
    // Texte pulsant
    if(n7>.6){const pa=.5+.5*Math.sin(T*2);ctx.fillStyle=`rgba(255,255,255,${pa*n7})`;ctx.font='12px Inter,sans-serif';ctx.textAlign='center';ctx.fillText('JE SUIS',cx,cy+eyeR+20)}
  }
  document.getElementById('level').textContent='n='+lvl;document.getElementById('subtitle').textContent=sub;
  document.getElementById('speedVal').textContent=spd+'x';
}
function loop(){if(playing){t+=.04*spd/12;if(t>70)t=0}draw();requestAnimationFrame(loop)}loop();
</script></body></html>
