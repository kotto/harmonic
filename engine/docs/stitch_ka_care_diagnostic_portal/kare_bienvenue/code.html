<style>
        body {
            background-color: #0d0d0d;
            margin: 0;
            overflow: hidden;
        }

        .resonance-glow {
            background: radial-gradient(circle at center, rgba(212, 168, 83, 0.15) 0%, transparent 70%);
        }

        .wave-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.4;
            pointer-events: none;
        }

        .pulse-wave {
            position: absolute;
            border: 1px solid rgba(212, 168, 83, 0.3);
            border-radius: 50%;
            animation: pulse 4s infinite linear;
        }

        @keyframes pulse {
            0% { width: 100px; height: 100px; opacity: 0; border-width: 2px; }
            50% { opacity: 0.5; }
            100% { width: 800px; height: 800px; opacity: 0; border-width: 1px; }
        }

        .fade-in-up {
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .gold-border-glow {
            box-shadow: 0 0 20px rgba(212, 168, 83, 0.2);
            border: 1px solid rgba(212, 168, 83, 0.4);
        }

        .glass-panel {
            background: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>

<!-- Micro-interaction Script -->
<script>
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.resonance-glow');
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            glow.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(212, 168, 83, 0.12) 0%, transparent 60%)`;
        });

        // Entrance effect for waves
        const waves = document.querySelectorAll('.pulse-wave');
        waves.forEach((wave, i) => {
            wave.style.opacity = '0';
            setTimeout(() => {
                wave.style.transition = 'opacity 2s ease';
                wave.style.opacity = '0.5';
            }, 1000 + (i * 500));
        });
    </script>
