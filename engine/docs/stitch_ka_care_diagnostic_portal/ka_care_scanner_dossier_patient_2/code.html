<script>
        // Micro-interactions and effects
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('div');
                ripple.className = 'absolute rounded-full bg-primary/20 pointer-events-none transform -translate-x-1/2 -translate-y-1/2';
                ripple.style.left = e.clientX - this.getBoundingClientRect().left + 'px';
                ripple.style.top = e.clientY - this.getBoundingClientRect().top + 'px';
                ripple.style.width = '0px';
                ripple.style.height = '0px';
                this.appendChild(ripple);
                
                const anim = ripple.animate([
                    { width: '0px', height: '0px', opacity: 0.5 },
                    { width: '200px', height: '200px', opacity: 0 }
                ], { duration: 500, easing: 'ease-out' });
                
                anim.onfinish = () => ripple.remove();
            });
        });

        // Search highlight effect
        const searchInput = document.querySelector('input[type="text"]');
        searchInput.addEventListener('focus', () => {
            searchInput.parentElement.classList.add('resonance-glow');
        });
        searchInput.addEventListener('blur', () => {
            searchInput.parentElement.classList.remove('resonance-glow');
        });
    </script>
