services:
  - type: web
    name: ka-mobile
    env: static
    rootDir: engine/ka-mobile-android
    buildCommand: npm ci && npm run build
    staticPublishPath: www
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api.kamobile.ai
