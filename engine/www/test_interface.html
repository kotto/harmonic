<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KA — Test Interface</title>
<style>
:root{--bg:#0a0a14;--surface:#141428;--border:#252540;--gold:#d4a843;--cyan:#00bcd4;--text:#e0e0f0;--dim:#8080a0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;max-width:800px;margin:0 auto}
h1{color:var(--gold);margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.card h2{font-size:1em;color:var(--cyan);margin-bottom:8px}
textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-family:monospace;resize:vertical;min-height:60px}
button{background:var(--cyan);color:#000;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-weight:600;margin-top:8px}
button.gold{background:var(--gold)}
.result{background:var(--bg);border-radius:8px;padding:12px;margin-top:12px;white-space:pre-wrap;font-size:0.9em;line-height:1.5;max-height:400px;overflow-y:auto}
.result b{color:var(--gold)}
hr{border-color:var(--border);margin:12px 0}
.status{color:var(--cyan);font-size:0.8em;margin-bottom:12px}
</style>
</head>
<body>

<h1>🌊 KA — Interface de test</h1>
<div class="status" id="status">Connexion au serveur...</div>

<!-- Chat -->
<div class="card">
  <h2>💬 Chat</h2>
  <textarea id="chat-input" placeholder="Pose une question..."></textarea>
  <button onclick="chat()">Envoyer</button>
  <div class="result" id="chat-result"></div>
</div>

<!-- Debug -->
<div class="card">
  <h2>🔬 Debug</h2>
  <textarea id="debug-input" placeholder="Décris un symptôme de bug..."></textarea>
  <button onclick="debug()">Diagnostiquer</button>
  <div class="result" id="debug-result"></div>
</div>

<!-- Hologram -->
<div class="card">
  <h2>🧬 Créer un hologramme</h2>
  <input type="text" id="holo-domain" placeholder="Domaine (ex: jardinage urbain)" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);margin-bottom:8px">
  <button class="gold" onclick="createHologram()">🌐 Créer</button>
  <div class="result" id="holo-result"></div>
</div>

<script>
const API = 'http://localhost:8765';

async function chat(){
  const msg = document.getElementById('chat-input').value.trim();
  if(!msg) return;
  const r = document.getElementById('chat-result');
  r.innerHTML = '⏳...';
  try {
    const res = await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const d = await res.json();
    r.innerHTML = `<b>KA</b> (${d.source||'?'}, ${d.confidence?Math.round(d.confidence*100)+'%':''})<br><br>${d.response||d.text||JSON.stringify(d)}`;
  }catch(e){r.innerHTML='❌ '+e.message}
}

async function debug(){
  const sym = document.getElementById('debug-input').value.trim();
  if(!sym) return;
  const r = document.getElementById('debug-result');
  r.innerHTML = '⏳...';
  try {
    const res = await fetch(API+'/api/debug',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symptom:sym})});
    const d = await res.json();
    r.innerHTML = `<b>${d.diagnosis?.interference||'?'}</b> (${Math.round((d.diagnosis?.confidence||0)*100)}%)<br><br>${d.diagnosis?.explanation||''}<br><br>💊 <b>${d.diagnosis?.strategy||''}</b><br>→ ${d.diagnosis?.action||''}`;
  }catch(e){r.innerHTML='❌ '+e.message}
}

async function createHologram(){
  const domain = document.getElementById('holo-domain').value.trim();
  if(!domain) return;
  const r = document.getElementById('holo-result');
  r.innerHTML = '⏳ Génération en cours...';
  try {
    const res = await fetch(API+'/api/holograms/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domain,author:'test',facts:[['Test','est un','concept','GENERAL']]})});
    const d = await res.json();
    r.innerHTML = `<b>${d.status}</b><br>${JSON.stringify(d,null,2)}`;
  }catch(e){r.innerHTML='❌ '+e.message}
}

// Vérifier la connexion
fetch(API+'/api/health').then(r=>r.json()).then(d=>{
  document.getElementById('status').innerHTML = `✅ Connecté — ${d.status||'OK'} | Harmonic: ${d.harmonic} | HCV: ${d.hcv}`;
}).catch(()=>{
  document.getElementById('status').innerHTML = '❌ Serveur inaccessible. Lance: python ka_server.py';
});
</script>
</body>
</html>
