<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KA — La Sphère</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #161411;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    cursor: grab;
  }
  body:active { cursor: grabbing; }
  
  #sphere-container {
    width: 100vw; height: 100vh;
    position: fixed; top: 0; left: 0; z-index: 1;
  }
  
  .overlay {
    position: fixed; z-index: 10; pointer-events: none;
    text-align: center; bottom: 60px; left: 50%;
    transform: translateX(-50%);
  }
  .overlay .name {
    font-size: 2.5rem; font-weight: 300; letter-spacing: 0.15em;
    background: linear-gradient(180deg, #d9ceb5, #a89978);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: breathe 4s ease-in-out infinite;
  }
  .overlay .sub {
    font-size: 0.7rem; color: #a89978; letter-spacing: 0.2em;
    margin-top: 4px;
  }
  
  .hint {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    z-index: 10; color: #555; font-size: 0.6rem; letter-spacing: 0.1em;
    pointer-events: none;
    animation: fadeHint 3s ease-in-out 2s forwards;
  }
  
  @keyframes breathe {
    0%, 100% { opacity: 0.8; letter-spacing: 0.15em; }
    50% { opacity: 1; letter-spacing: 0.25em; }
  }
  @keyframes fadeHint {
    0% { opacity: 0.6; } 80% { opacity: 0.1; } 100% { opacity: 0; }
  }
</style>
</head>
<body>

<div id="sphere-container"></div>
<div class="hint">🎯 Glissez pour explorer · Molette pour zoomer</div>
<div class="overlay">
  <div class="name">K A</div>
  <div class="sub">φ · α=1/137 · ℂ⁵¹²</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// KA SPHERE — La représentation visuelle du compagnon
// ═══════════════════════════════════════════════════════════════════
const PHI = 1.618033988749895;
const TAU = 2 * Math.PI;

// Scene
const container = document.getElementById('sphere-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 50);
camera.position.z = 5;

// ── La Sphère KA ──────────────────────────────────────────────────
const sphereGeo = new THREE.SphereGeometry(1.2, 128, 128);

// Shader personnalisé : surface ondulatoire dorée
const sphereMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
  uColor1: { value: new THREE.Color('#c4b698') },
  uColor2: { value: new THREE.Color('#2a241e') },
    uPhi: { value: PHI },
  },
  vertexShader: /* glsl */ `
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying float vDisplacement;
    uniform float uTime;
    uniform float uPhi;
    
    // Bruit de Perlin simplifié pour les ondulations
    float wave(vec3 p) {
      return sin(p.x * 5.0 + uTime * 0.3) * sin(p.y * 7.0 + uTime * 0.5) * sin(p.z * 6.0 + uTime * 0.4);
    }
    
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vPosition = position;
      
      // Ondulation φ — lente, mystérieuse
      float d1 = wave(position * uPhi);
      float d2 = wave(position * uPhi * 2.0 + uTime * 0.2);
      float d3 = sin(position.x * 8.0 + uTime * 0.7) * sin(position.y * 8.0 + uTime * 0.5) * 0.08;
      float displacement = d1 * 0.06 + d2 * 0.04 + d3;
      vDisplacement = displacement;
      
      vec3 newPosition = position + normal * displacement;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
  `,
  fragmentShader: /* glsl */ `
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying float vDisplacement;
    uniform float uTime;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    
    void main() {
      // Lumière mystérieuse — dépend de l'angle
      vec3 lightDir = normalize(vec3(sin(uTime * 0.2), cos(uTime * 0.3), 1.0));
      float diff = max(0.0, dot(vNormal, lightDir));
      
      // Mélange de couleurs selon la hauteur de l'ondulation
      float mixFactor = smoothstep(-0.1, 0.1, vDisplacement) * 0.5 + 0.5;
      vec3 color = mix(uColor2, uColor1, mixFactor);
      
      // Brillance dorée
      float specular = pow(max(0.0, dot(reflect(-lightDir, vNormal), vec3(0, 0, 1))), 32.0);
      color += uColor1 * specular * 0.5;
      
      // Lueur ambiante
      color += uColor2 * 0.1;
      color += diff * uColor1 * 0.3;
      
      // Bord mystérieux
      float fresnel = pow(1.0 - abs(dot(vNormal, vec3(0, 0, 1))), 3.0);
      color += uColor1 * fresnel * 0.2;
      
      gl_FragColor = vec4(0.77, 0.71, 0.60, 0.95);
    }
  `,
  transparent: true,
});

const sphere = new THREE.Mesh(sphereGeo, sphereMat);
scene.add(sphere);

// ── Particules orbitales ──────────────────────────────────────────
const particlesCount = 200;
const particlesGeo = new THREE.BufferGeometry();
const particlesPos = new Float32Array(particlesCount * 3);
const particlesSizes = new Float32Array(particlesCount);

for (let i = 0; i < particlesCount; i++) {
  const theta = Math.random() * TAU;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 1.35 + Math.random() * 0.8;
  particlesPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
  particlesPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  particlesPos[i*3+2] = r * Math.cos(phi);
  particlesSizes[i] = Math.random() * 2.0 + 0.5;
}

particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlesPos, 3));
particlesGeo.setAttribute('size', new THREE.BufferAttribute(particlesSizes, 1));

const particlesMat = new THREE.PointsMaterial({
  color: '#c4b698',
  size: 0.02,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true,
  opacity: 0.6,
});

const particles = new THREE.Points(particlesGeo, particlesMat);
scene.add(particles);

// ── Anneau φ ──────────────────────────────────────────────────────
const ringGeo = new THREE.TorusGeometry(1.55, 0.008, 16, 200);
const ringMat = new THREE.MeshBasicMaterial({
  color: '#c4b698',
  transparent: true,
  opacity: 0.3,
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = TAU / PHI; // Inclinaison φ
scene.add(ring);

// Second anneau
const ring2Geo = new THREE.TorusGeometry(1.7, 0.005, 16, 150);
const ring2Mat = new THREE.MeshBasicMaterial({
  color: '#c4b698',
  transparent: true,
  opacity: 0.15,
});
const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
ring2.rotation.y = TAU / 3;
ring2.rotation.x = TAU / 5;
scene.add(ring2);

// ── Lueur ambiante ────────────────────────────────────────────────
const glowGeo = new THREE.SphereGeometry(1.5, 32, 32);
const glowMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
  },
  vertexShader: /* glsl */ `
    varying vec3 vNormal;
    varying vec3 vPosition;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vPosition = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */ `
    varying vec3 vNormal;
    varying vec3 vPosition;
    uniform float uTime;
    void main() {
      float intensity = pow(0.65 - dot(vNormal, vec3(0, 0, 1)), 3.0);
      float pulse = 1.0 + sin(uTime * 0.5) * 0.15;
      gl_FragColor = vec4(0.77, 0.71, 0.60, intensity * 0.10 * pulse);
    }
  `,
  transparent: true,
  depthWrite: false,
});
const glow = new THREE.Mesh(glowGeo, glowMat);
scene.add(glow);

// ── Éclairage ─────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x222244, 0.3));
const pointLight = new THREE.PointLight(0xd9ceb5, 1.0, 10);
pointLight.position.set(2, 1, 3);
scene.add(pointLight);

// ── Souris ────────────────────────────────────────────────────────
let isDragging = false, prevMouse = { x: 0, y: 0 };
let targetRotX = 0, targetRotY = 0;
let currentRotX = 0, currentRotY = 0;
let zoom = 5;

renderer.domElement.addEventListener('mousedown', (e) => {
  isDragging = true; prevMouse = { x: e.clientX, y: e.clientY };
});
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  targetRotY += (e.clientX - prevMouse.x) * 0.005;
  targetRotX += (e.clientY - prevMouse.y) * 0.005;
  targetRotX = Math.max(-1.5, Math.min(1.5, targetRotX));
  prevMouse = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('wheel', (e) => {
  zoom = Math.max(3, Math.min(12, zoom + e.deltaY * 0.01));
});
// Touch
renderer.domElement.addEventListener('touchstart', (e) => {
  isDragging = true; prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
renderer.domElement.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  targetRotY += (e.touches[0].clientX - prevMouse.x) * 0.005;
  targetRotX += (e.touches[0].clientY - prevMouse.y) * 0.005;
  targetRotX = Math.max(-1.5, Math.min(1.5, targetRotX));
  prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
renderer.domElement.addEventListener('touchend', () => { isDragging = false; });

// ── Animation Loop ────────────────────────────────────────────────
function animate(timestamp) {
  requestAnimationFrame(animate);
  
  const dt = 0.016;
  const t = timestamp * 0.001;
  
  // Rotation automatique lente (si pas de drag)
  if (!isDragging) {
    targetRotY += dt * 0.1;
    targetRotX += Math.sin(t * 0.3) * dt * 0.05;
  }
  
  // Lissage
  currentRotX += (targetRotX - currentRotX) * 0.05;
  currentRotY += (targetRotY - currentRotY) * 0.05;
  
  sphere.rotation.x = currentRotX;
  sphere.rotation.y = currentRotY;
  particles.rotation.x = currentRotX * 0.5;
  particles.rotation.y = currentRotY * 0.7;
  ring.rotation.z += dt * 0.1;
  ring2.rotation.z -= dt * 0.07;
  glow.rotation.x = currentRotX * 0.3;
  glow.rotation.y = currentRotY * 0.3;
  
  // Update shaders
  sphere.material.uniforms.uTime.value = t;
  glow.material.uniforms.uTime.value = t;
  
  // Camera
  camera.position.z += (zoom - camera.position.z) * 0.05;
  
  renderer.render(scene, camera);
}

// Resize
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

requestAnimationFrame(animate);
</script>
</body>
</html>
