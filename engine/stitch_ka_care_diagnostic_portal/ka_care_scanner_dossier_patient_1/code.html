<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
.scan-line {
    animation: scan 2.5s ease-in-out infinite;
    background: linear-gradient(to bottom, transparent, #f2c36b, transparent)
    }
@keyframes scan {
    0% {
        transform: translateY(-100%);
        opacity: 0;
        } 50% {
        opacity: 0.8;
        } 100% {
        transform: translateY(400%);
        opacity: 0;
        }
    }
.pulse-gold {
    animation: pulse-gold 2s cubic-bezier(0.4, 0, 0.6, 1) infinite
    }
@keyframes pulse-gold {
    0%, 100% {
        opacity: 1;
        filter: drop-shadow(0 0 5px rgba(242, 195, 107, 0.5));
        } 50% {
        opacity: 0.7;
        filter: drop-shadow(0 0 15px rgba(242, 195, 107, 0.8));
        }
    }

<body class="bg-background text-on-background font-body-md overflow-hidden h-screen w-screen flex flex-col">

<button class="flex items-center text-on-surface-variant hover:text-primary transition-colors cursor-pointer active:scale-95" onclick="history.back()">
<span class="material-symbols-outlined mr-2">close</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Fermer</span>
</button>
<div class="flex flex-col items-center">

</div>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-all active:scale-90" id="flash-toggle" onclick="toggleFlash()">
<span class="material-symbols-outlined" id="flash-icon">flashlight_on</span>
</button>
</header>
<!-- Main Scanner Canvas -->

</div>
<!-- Overlay for focused scanning -->
<div class="absolute inset-0 bg-background/40 backdrop-blur-[2px] z-10"></div>
<!-- Scanner Viewfinder (Viseur) -->
<div class="relative z-20 w-[280px] h-[280px] md:w-[400px] md:h-[400px] flex items-center justify-center">
<!-- Corners (Style Ambre/Or) -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-primary rounded-tl-full pulse-gold"></div>

<!-- Clear cutout for scanning -->
<div class="w-full h-full border border-primary/20 bg-transparent rounded-xl relative overflow-hidden">
<!-- Animated Scan Line -->
<div class="scan-line absolute top-0 left-0 w-full h-2 z-30"></div>
<!-- Mock Data Resonance Waves (Subtle Background) -->

</div>
</div>

            </p>

<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-[500px] h-[300px] bg-primary/5 blur-[120px] rounded-full pointer-events-none z-0"></div>
<div class="fixed top-0 right-0 w-[300px] h-[300px] bg-primary/5 blur-[100px] rounded-full pointer-events-none z-0"></div>
<script>
        let flashActive = false;
        const flashIcon = document.getElementById('flash-icon');
        const flashBtn = document.getElementById('flash-toggle');

        function toggleFlash() {
            flashActive = !flashActive;
            if (flashActive) {
                flashIcon.innerText = 'flashlight_off';
                flashBtn.classList.add('bg-primary', 'text-on-primary');
                flashBtn.classList.remove('bg-surface-container', 'text-on-surface-variant');
            } else {
                flashIcon.innerText = 'flashlight_on';
                flashBtn.classList.remove('bg-primary', 'text-on-primary');
                flashBtn.classList.add('bg-surface-container', 'text-on-surface-variant');
            }
        }

        // Haptic Feedback Simulation for scanning detection
        document.addEventListener('DOMContentLoaded', () => {
            // Simulated "Success" trigger for demonstration
            setTimeout(() => {
                console.log("Scanner Ready...");
            }, 1000);
        });
    </script>
