<style>
        body {
            background-color: #0d0d0d;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .resonance-glow {
            background: radial-gradient(circle at center, rgba(212, 168, 83, 0.15) 0%, rgba(13, 13, 13, 0) 70%);
        }

        .wave-animation {
            mask-image: linear-gradient(to right, transparent, black, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black, transparent);
        }

        @keyframes pulse-gold {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .animate-pulse-gold {
            animation: pulse-gold 4s ease-in-out infinite;
        }

        .glass-card {
            background: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 168, 83, 0.1);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

<style>
    body {

<body class="flex items-center justify-center font-body-md text-on-surface">
<!-- Atmospheric Background Layers -->

<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-lg px-gutter text-center flex flex-col items-center justify-center space-y-stack-lg">
<!-- Brand Core -->
<div class="flex flex-col items-center space-y-4">
<!-- Logo Icon (Resonance Wave) -->
<div class="relative group">
<div class="absolute inset-0 bg-primary blur-2xl opacity-20 rounded-full group-hover:opacity-40 transition-opacity duration-700"></div>
<div class="w-24 h-24 flex items-center justify-center rounded-full glass-card border-primary/30 relative overflow-hidden">

<!-- Micro-interactions Script -->
<script>
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.resonance-glow');
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            glow.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(212, 168, 83, 0.15) 0%, rgba(13, 13, 13, 0) 70%)`;
        });

        // Simple button interaction sounds / visuals could be added here
        const primaryBtn = document.querySelector('button');
        primaryBtn.addEventListener('mousedown', () => {
            primaryBtn.classList.add('shadow-none');
        });
        primaryBtn.addEventListener('mouseup', () => {
            primaryBtn.classList.remove('shadow-none');
        });
    </script>
