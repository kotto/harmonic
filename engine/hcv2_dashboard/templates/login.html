<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCV2 Pro — Connexion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07070f;color:rgba(255,255,255,.92);font-family:-apple-system,'Inter',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:48px 40px;max-width:400px;width:100%}
.login h1{font-size:24px;font-weight:300;text-align:center;margin-bottom:4px}
.login h1 span{color:#8b83ff;font-weight:600}
.login p{font-size:14px;color:rgba(255,255,255,.42);text-align:center;margin-bottom:32px}
.login label{font-size:13px;color:rgba(255,255,255,.62);display:block;margin-bottom:6px}
.login input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;font-size:14px;color:rgba(255,255,255,.92);outline:none;margin-bottom:16px;transition:border-color .2s}
.login input:focus{border-color:#8b83ff}
.login button{width:100%;background:linear-gradient(135deg,#8b83ff,#6b5fff);color:#fff;padding:14px;border-radius:12px;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:opacity .2s}
.login button:hover{opacity:.9}
.error{background:rgba(255,80,80,.12);color:#ff5050;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;text-align:center}
.footer{text-align:center;margin-top:20px;font-size:12px;color:rgba(255,255,255,.36)}
</style>
</head>
<body>
<div class="login">
  <h1>HCV2<span>Pro</span></h1>
  <p>Compression Harmonique Professionnelle</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <label>Identifiant</label>
    <input type="text" name="username" placeholder="admin" required autofocus>
    <label>Mot de passe</label>
    <input type="password" name="password" placeholder="••••••" required>
    <button type="submit">Se connecter</button>
  </form>
  <div class="footer">Démo : demo / demo123</div>
</div>
</body>
</html>
