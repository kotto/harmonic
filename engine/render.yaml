# Render Blueprint — KA PHONE (Harmonic AI + HCV Compression)
# Déploiement: connecter le repo GitHub à Render, il détecte ce fichier.

services:
  - type: web
    name: ka-phone
    env: python
    region: frankfurt
    plan: starter
    buildCommand: |
      pip install -r requirements_server.txt
      mkdir -p data/bootstrapper_output
      echo "KA PHONE build $(date)" > data/build_info.txt
    startCommand: gunicorn ka_server:app --bind 0.0.0.0:$PORT --workers 1 --preload --timeout 120 --access-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: KA_PERSONALITY
        value: "Tu es KA, assistant personnel. Ton ton est chaleureux et concis. Tu réponds en français, en 2-3 phrases."
    autoDeploy: true

# Endpoints disponibles :
#   /                  — KA Phone PWA (interface complète)
#   /api/chat          — conversation IA
#   /api/reason        — raisonnement
#   /api/create        — créativité
#   /api/haiku         — haïku
#   /api/stats         — statistiques
#   /api/health        — santé du serveur
#   /api/health/diagnostic — diagnostic médical harmonique
#   /api/memory/recent — souvenirs récents
#   /api/storage/analyze    — analyse de fichiers
#   /api/storage/optimize   — compression de fichiers
#   /api/storage/optimize-batch — compression par lot
#   /api/storage/view       — décompression + upscale 4K
#   /api/harmonic/encode    — compression harmonique (dictionnaire)

  - type: web
    name: ka-care
    env: python
    region: frankfurt
    plan: starter
    rootDir: engine/ka_care
    buildCommand: pip install flask flask-cors gunicorn
    startCommand: gunicorn ka_care:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    autoDeploy: true

# KA CARE — Endpoints :
#   /                   — Interface de santé PWA
#   /api/health         — État du serveur
#   /api/screen/pneumonia    — Dépistage pneumonie (OMS/IMCI)
#   /api/screen/dehydration  — Évaluation déshydratation (OMS)
#   /api/screen/fever        — Détection syndrome fébrile
#   /api/screen/anemia       — Dépistage anémie
#   /api/screen/newborn      — Signes danger nouveau-né
#   /api/assess              — Évaluation communautaire complète
#   /api/indicators          — Indicateurs harmoniques depuis PPG
