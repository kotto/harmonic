services:
  - type: web
    name: hcv2-pro-www
    env: static
    buildCommand: cp -r www/* .
    staticPublishPath: .
    domain: hcv2.pro
  - type: web
    name: hcv2-pro-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python hcv2_dashboard/app.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8765
    healthCheckPath: /api/health
