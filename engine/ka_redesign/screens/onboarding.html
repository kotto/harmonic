<div class="ka-screen" id="screen-onboarding" data-screen="onboarding">
  <header class="ka-screen__header">
    <h2 class="ka-screen__title">Onboarding KA</h2>
  </header>
  <main class="ka-screen__body">

    <div class="onboarding__progress" style="margin-bottom: var(--space-large);">
      <div class="flex-between" style="margin-bottom: 8px;">
        <span style="font-size: var(--text-small); color: var(--color-text-muted);">Étape 1/3</span>
        <span style="font-size: var(--text-small); color: var(--color-primary);">Centres d'intérêt</span>
      </div>
      <div class="storage__gauge-bar">
        <div class="storage__gauge-fill" style="width: 33%;"></div>
      </div>
    </div>
    
    <div class="text-center" style="margin-bottom: var(--space-large);">
      <h2>Bienvenue sur KA</h2>
      <p style="color: var(--color-text-muted); margin-top: 8px;">
        Sélectionnez vos centres d'intérêt pour personnaliser votre expérience
      </p>
    </div>
    
    <div class="onboarding__interests grid-auto" style="--min-col: 100px; gap: var(--gap-small);">
<button class="onboarding__interest" data-interest="Sciences" onclick="KA.toggleInterest(this)">Sciences</button>
<button class="onboarding__interest" data-interest="Tech" onclick="KA.toggleInterest(this)">Tech</button>
<button class="onboarding__interest" data-interest="Philosophie" onclick="KA.toggleInterest(this)">Philosophie</button>
<button class="onboarding__interest" data-interest="Art" onclick="KA.toggleInterest(this)">Art</button>
<button class="onboarding__interest" data-interest="Cuisine" onclick="KA.toggleInterest(this)">Cuisine</button>
<button class="onboarding__interest" data-interest="Sport" onclick="KA.toggleInterest(this)">Sport</button>
<button class="onboarding__interest" data-interest="Musique" onclick="KA.toggleInterest(this)">Musique</button>
<button class="onboarding__interest" data-interest="Histoire" onclick="KA.toggleInterest(this)">Histoire</button>
<button class="onboarding__interest" data-interest="Santé" onclick="KA.toggleInterest(this)">Santé</button>
<button class="onboarding__interest" data-interest="Business" onclick="KA.toggleInterest(this)">Business</button>
<button class="onboarding__interest" data-interest="Voyage" onclick="KA.toggleInterest(this)">Voyage</button>
<button class="onboarding__interest" data-interest="Nature" onclick="KA.toggleInterest(this)">Nature</button>
    </div>
    
    <div class="form-group" style="margin-top: var(--space-medium);">
      <label for="onboarding-custom">Domaine personnalisé</label>
      <input type="text" id="onboarding-custom" placeholder="Ex: Astrophysique, Blockchain...">
    </div>
    
    <button class="btn btn-primary" onclick="KA.completeOnboarding()" style="width: 100%; margin-top: var(--space-large);">
      Continuer →
    </button>
  </main>
</div>

<style>
/* ═══ onboarding Screen Specific ═══ */
.ka-screen__header {
  padding: var(--space-medium, 20px);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-bg-alt);
}
.ka-screen__title {
  font-size: var(--text-h4);
  font-weight: 700;
  color: var(--color-text);
}
.ka-screen__body {
  padding: var(--space-medium, 20px);
  overflow-y: auto;
  flex: 1;
}

  .onboarding__interest {
    padding: 16px 12px;
    border-radius: var(--radius-md, 8px);
    border: 2px solid var(--color-border);
    background: var(--color-bg-alt);
    font-size: var(--text-body);
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    font: inherit;
    color: inherit;
  }
  .onboarding__interest:hover {
    border-color: var(--color-primary);
  }
  .onboarding__interest.selected {
    border-color: var(--color-primary);
    background: hsla(262, 60%, 55%, 0.12);
    color: var(--color-primary);
    box-shadow: 0 0 16px hsla(262, 60%, 55%, 0.15);
  }
</style>

<script>
/* ═══ onboarding Screen Logic ═══ */
(() => {
  const screen = document.getElementById('screen-onboarding');
  if (!screen) return;

  let selectedInterests = [];
  window.KA.toggleInterest = (btn) => {
    btn.classList.toggle('selected');
    const interest = btn.dataset.interest;
    if (btn.classList.contains('selected')) {
      selectedInterests.push(interest);
    } else {
      selectedInterests = selectedInterests.filter(i => i !== interest);
    }
  };
})();
</script>
