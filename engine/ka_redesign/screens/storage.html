<!-- KA Screen: storage — Optimiseur Stockage                    -->
<!-- Generated by Harmonic Frontend Engine           -->
<!-- ═══════════════════════════════════════════════ -->
<div class="ka-screen" id="screen-storage" data-screen="storage">
  <header class="ka-screen__header">
    <h2 class="ka-screen__title">Optimiseur Stockage</h2>
  </header>
  <main class="ka-screen__body">

    <div class="storage__upload upload-zone" id="storage-upload-zone"
         ondragover="this.style.borderColor='var(--color-primary)'" 
         ondragleave="this.style.borderColor='var(--color-border)'"
         ondrop="KA.handleStorageDrop(event)"
         onclick="document.getElementById('storage-file-input').click()">
      <span style="font-size:2.5rem;">🗜️</span>
      <p>Glissez-déposez un fichier à compresser</p>
      <span style="font-size:var(--text-small);color:var(--color-text-muted);">Images, documents, archives...</span>
      <input type="file" id="storage-file-input" style="display:none" onchange="KA.handleStorageFile(this)">
    </div>
    
    <div class="storage__quality" style="margin-top: var(--space-medium);">
      <label style="font-weight:500; display:block; margin-bottom:8px;">Qualité de compression</label>
      <div class="flex flex-gap-sm">
        <button class="chip chip--active" onclick="KA.setStorageQuality('archive')">📦 Archive</button>
        <button class="chip" onclick="KA.setStorageQuality('standard')">⚡ Standard</button>
        <button class="chip" onclick="KA.setStorageQuality('eco')">🌱 Éco</button>
      </div>
    </div>
    
    <div class="storage__gauge" style="margin-top: var(--space-large);">
      <div class="storage__gauge-header flex-between">
        <span>Espace économisé</span>
        <span id="storage-saved-pct" style="color: var(--color-success); font-weight:700;">0%</span>
      </div>
      <div class="storage__gauge-bar">
        <div class="storage__gauge-fill" id="storage-gauge-fill" style="width: 0%;"></div>
      </div>
      <div class="flex-between" style="margin-top:4px; font-size:var(--text-small); color:var(--color-text-muted);">
        <span id="storage-before">Avant: --</span>
        <span id="storage-after">Après: --</span>
      </div>
    </div>
    
    <div class="storage__history" style="margin-top: var(--space-large);">
      <h3>Derniers fichiers optimisés</h3>
      <div id="storage-history" style="margin-top:8px;">
        <p style="color: var(--color-text-muted);">Aucun fichier optimisé</p>
      </div>
    </div>
  </main>
</div>

<style>
/* ═══ storage Screen Specific ═══ */
.ka-screen__header {
  padding: var(--space-medium, 20px);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-bg-alt);
}
.ka-screen__title {
  font-size: var(--text-h4);
  font-weight: 700;
  color: var(--color-text);
}
.ka-screen__body {
  padding: var(--space-medium, 20px);
  overflow-y: auto;
  flex: 1;
}

  .storage__gauge-bar {
    height: 12px;
    background: var(--color-bg-alt);
    border-radius: var(--radius-full);
    overflow: hidden;
    margin-top: 8px;
  }
  .storage__gauge-fill {
    height: 100%;
    background: var(--gradient-primary);
    border-radius: var(--radius-full);
    transition: width 0.6s ease-out;
  }
</style>

  const screen = document.getElementById('screen-storage');
  if (!screen) return;

</script>
