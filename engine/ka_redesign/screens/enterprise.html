  </header>
  <main class="ka-screen__body">

    <div class="enterprise__setup" id="enterprise-setup">
      <h3>Configuration Enterprise</h3>
      <div class="form-group">
        <label for="ent-name">Nom de l'entreprise</label>
        <input type="text" id="ent-name" placeholder="Ex: TechCorp">

        Créer un tenant
      </button>

    </div>
    
    <div class="enterprise__diagnose" style="margin-top: var(--space-large);">

      <div class="form-group">
        <label for="ent-symptom">Symptôme</label>
        <textarea id="ent-symptom" rows="3" placeholder="Décrivez le bug..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="KA.diagnoseBug()" style="width:100%;margin-top:12px;">
        🔍 Diagnostiquer
      </button>
      <div id="ent-diagnosis" style="display:none; margin-top:12px;"></div>
    </div>
    
    <div class="enterprise__upload" style="margin-top: var(--space-large);">
      <h3>Upload de Fichiers</h3>
      <div class="upload-zone" id="ent-upload-zone" 
           ondragover="this.style.borderColor='var(--color-primary)'" 
           ondragleave="this.style.borderColor='var(--color-border)'"
           ondrop="KA.handleEnterpriseDrop(event)">
        <span style="font-size:2rem;">📁</span>
        <p>Glissez-déposez des fichiers ici</p>
        <span style="font-size:var(--text-small);color:var(--color-text-muted);">logs, code, PDF, DOCX, CSV...</span>
      </div>
    </div>
    
    <div class="enterprise__history" style="margin-top: var(--space-large);">
      <h3>Historique</h3>
      <div id="ent-history" style="margin-top:8px;">
        <p style="color: var(--color-text-muted);">Aucun diagnostic récent</p>
      </div>
    </div>
  </main>
</div>
