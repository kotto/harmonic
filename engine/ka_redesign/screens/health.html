<!-- KA Screen: health — Diagnostic Santé                    -->
<!-- Generated by Harmonic Frontend Engine           -->
<!-- ═══════════════════════════════════════════════ -->
<div class="ka-screen" id="screen-health" data-screen="health">
  <header class="ka-screen__header">
    <h2 class="ka-screen__title">Diagnostic Santé</h2>
  </header>
  <main class="ka-screen__body">

    <form class="health__form" onsubmit="KA.runHealthDiagnostic(event)">
      <div class="form-group">
        <label for="health-symptoms">Symptômes</label>
        <textarea id="health-symptoms" rows="3" placeholder="Décrivez vos symptômes..." required></textarea>
      </div>
      
      <div class="health__vitals grid-3" style="gap: var(--gap-small);">
        <div class="form-group">
          <label for="health-hr">Fréq. cardiaque</label>
          <input type="number" id="health-hr" placeholder="BPM" min="30" max="220">
        </div>
        <div class="form-group">
          <label for="health-temp">Température</label>
          <input type="number" id="health-temp" placeholder="°C" step="0.1" min="34" max="43">
        </div>
        <div class="form-group">
          <label for="health-bp">Tension</label>
          <input type="text" id="health-bp" placeholder="120/80">
        </div>
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-medium);">
        🔬 Lancer le diagnostic
      </button>
    </form>
    
    <div class="health__result" id="health-result" style="display:none; margin-top: var(--space-large);">
      <div class="health__score">
        <span class="health__score-label">Score Harmonique</span>
        <span class="health__score-value" id="health-score">--</span>
      </div>
      <div class="health__recommendations" id="health-recommendations"></div>
    </div>
  </main>
</div>

<style>
/* ═══ health Screen Specific ═══ */
.ka-screen__header {
  padding: var(--space-medium, 20px);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-bg-alt);
}
.ka-screen__title {
  font-size: var(--text-h4);
  font-weight: 700;
  color: var(--color-text);
}
.ka-screen__body {
  padding: var(--space-medium, 20px);
  overflow-y: auto;
  flex: 1;
}

  .health__vitals {
    margin-top: var(--space-medium);
  }
  .health__result {
    animation: fadeIn 0.4s ease-out;
  }
  .health__score {
    text-align: center;
    padding: var(--space-large, 32px);
    background: var(--color-bg-alt);
    border-radius: var(--radius-lg, 16px);
    border: 2px solid var(--color-success);
  }
  .health__score-label {
    display: block;
    font-size: var(--text-small);
    color: var(--color-text-muted);
    margin-bottom: 8px;
  }
  .health__score-value {
    font-size: var(--text-h1);
    font-weight: 800;
    color: var(--color-success);
  }
  .health__recommendations {
    margin-top: var(--space-medium);
    padding: var(--space-medium);
    background: var(--color-bg-alt);
    border-radius: var(--radius-md, 8px);
    border: 1px solid var(--color-border);
  }
</style>

<script>
/* ═══ health Screen Logic ═══ */
(() => {
  const screen = document.getElementById('screen-health');
  if (!screen) return;

  const form = screen.querySelector('.health__form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const symptoms = document.getElementById('health-symptoms').value;
    const hr = document.getElementById('health-hr').value;
    const temp = document.getElementById('health-temp').value;
    const bp = document.getElementById('health-bp').value;
    
    try {
      const res = await KA.api.post('/api/health/diagnostic', {
        symptomes: symptoms,
        vitaux: { hr: parseInt(hr)||0, temp: parseFloat(temp)||0, bp }
      });
      document.getElementById('health-result').style.display = 'block';
      document.getElementById('health-score').textContent = res.score || '--';
      document.getElementById('health-recommendations').innerHTML = 
        '<p>' + (res.recommendations || 'Analyse en cours...') + '</p>';
    } catch(err) {
      console.error('Health diagnostic error:', err);
    }
  });
})();
</script>
