<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🌊 Interférences — Masse, Particule, Higgs</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050508;color:#fafafa;font-family:Inter,system-ui,sans-serif;overflow:hidden;height:100vh}canvas{display:block}#info{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}#title{font-size:18px;font-weight:700}#subtitle{font-size:11px;color:#a1a1aa;margin-top:2px}#ui{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;flex-wrap:wrap;justify-content:center}button{padding:7px 14px;border-radius:5px;border:1px solid #333;background:#111;color:#ccc;font-size:11px;cursor:pointer}button:hover{border-color:#f59e0b;background:#1a1a1a;color:#fff}button.active{background:#f59e0b;border-color:#f59e0b;color:#000;font-weight:600}button.mode-mass{background:#ef4444;border-color:#ef4444}button.mode-particle{background:#3b82f6;border-color:#3b82f6}button.mode-higgs{background:#8b5cf6;border-color:#8b5cf6}button.mode-force{background:#22c55e;border-color:#22c55e}</style></head><body><div id="info"><div id="title">🌊 Interférences — Masse · Particule · Higgs · Forces</div><div id="subtitle">Tout phénomène physique = une interférence d'ondes</div></div><canvas id="c"></canvas><div id="ui">
  <button id="btn-mass" class="active mode-mass" onclick="setMode('mass')">⚫ Masse (résistance)</button>
  <button id="btn-particle" class="mode-particle" onclick="setMode('particle')">⚛️ Particule (stationnaire)</button>
  <button id="btn-higgs" class="mode-higgs" onclick="setMode('higgs')">💜 Higgs (impulsion)</button>
  <button id="btn-force" class="mode-force" onclick="setMode('force')">🟢 Forces (EM)</button>
  <button id="btn-play" onclick="togglePlay()">⏯</button>
</div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,cx,cy,t=0,playing=!0,mode='mass';
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;cx=W/2;cy=H/2}resize();addEventListener('resize',resize);
function setMode(m){mode=m;document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+m).classList.add('active')}
function togglePlay(){playing=!playing;document.getElementById('btn-play').textContent=playing?'⏯ Pause':'▶ Play'}
function draw(){
  ctx.fillStyle='#050508';ctx.fillRect(0,0,W,H);const T=t;
  if(mode==='mass'){
    // MASS = resistance to phase change. Two waves trying to shift a heavy object.
    const mx=cx;const my=cy;
    // The "mass" - a dense interference core
    for(let r=0;r<60;r+=3){const wave=.4+.4*Math.sin(r*.15+T*.5+Math.sin(T*.3));const alpha=wave*.5*Math.exp(-r/80);
      ctx.strokeStyle=`rgba(239,68,68,${alpha})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(mx,my,r,0,Math.PI*2);ctx.stroke()}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx,my,10,0,Math.PI*2);ctx.fill();
    // Incoming waves trying to move the mass - they REFLECT
    for(let i=0;i<8;i++){const a=i*Math.PI/4;const dist=80+30*Math.sin(T*2+i);const sx=mx+dist*Math.cos(a),sy=my+dist*Math.sin(a);
      const wave=.3+.3*Math.sin(dist*.04-T*.8+i);const alpha=wave*.5;
      ctx.fillStyle=`rgba(245,200,80,${alpha})`;ctx.beginPath();ctx.arc(sx,sy,4,0,Math.PI*2);ctx.fill()}
    // Reflected waves (the resistance)
    for(let i=0;i<8;i++){const a=i*Math.PI/4;const dist=40+20*Math.cos(T*1.5+i)*.5;const sx=mx-dist*Math.cos(a),sy=my-dist*Math.sin(a);
      const alpha=.2+.1*Math.sin(T+i);ctx.fillStyle=`rgba(34,211,238,${alpha})`;ctx.beginPath();ctx.arc(sx,sy,3,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='11px Inter,sans-serif';ctx.textAlign='center';
    ctx.fillText('MASSE = résistance au changement de phase',cx,cy+100);
    ctx.fillText('Les ondes incidentes (ambre) REBONDISSENT sur le noyau dense (rouge)',cx,cy+118);
    ctx.fillText('Le boson de Higgs = l\'impulsion qui CRÉE ce noyau dense',cx,cy+136);
    document.getElementById('subtitle').textContent='Masse : quand une onde résiste au déphasage. Plus c\'est dense, plus ça résiste.';
  }
  else if(mode==='particle'){
    // PARTICLE = stable standing wave (interference pattern that doesn't disperse)
    const px=cx-120,py=cy-40;const qx=cx+120,qy=cy+40;
    // Particle A (stable)
    for(let i=0;i<12;i++){const r=10+i*3;const wave=.5+.5*Math.sin(r*.2-T*.4);const alpha=.4*Math.exp(-i/6);
      ctx.strokeStyle=`rgba(59,130,246,${alpha})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,py,r+wave*4,0,Math.PI*2);ctx.stroke()}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(59,130,246,.8)';ctx.font='10px Inter,sans-serif';ctx.textAlign='center';ctx.fillText('PARTICULE STABLE',px,py+40);ctx.fillText('(onde stationnaire)',px,py+54);
    // Particle B (unstable - dispersing)
    const disp=Math.min(1,(T%6)/3);for(let i=0;i<8;i++){const r=10+i*5*disp;const alpha=.3*(1-disp)*Math.exp(-i/5);
      ctx.strokeStyle=`rgba(239,68,68,${alpha})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(qx,qy,r,0,Math.PI*2);ctx.stroke()}
    if(disp<.95){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(qx,qy,4,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle='rgba(239,68,68,.8)';ctx.font='10px Inter,sans-serif';ctx.fillText('PARTICULE INSTABLE',qx,qy+40);ctx.fillText('(se disperse)',qx,qy+54);
    document.getElementById('subtitle').textContent='Particule = onde stationnaire. Stable si φ verrouille la phase. Instable sinon.';
  }
  else if(mode==='higgs'){
    // HIGGS = the PULSE that creates the dense core (mass)
    const hx=cx,hy=cy;
    // Background field (Higgs field = universal wave)
    for(let x=0;x<W;x+=4){for(let y=0;y<H;y+=4){
      const wave=Math.sin(x*.01+y*.008+T*.3)*.5+.5;const alpha=wave*.15;
      if(alpha<.03)continue;ctx.fillStyle=`rgba(139,92,246,${alpha})`;ctx.fillRect(x,y,4,4)}}
    // The Higgs pulse - a sudden IMPULSE
    const cycle=(T%8)/8;const pulse=cycle<.3?Math.sin(cycle/.3*Math.PI):0;
    if(pulse>.01){const pr=20+pulse*80;const pg=ctx.createRadialGradient(hx,hy,0,hx,hy,pr);
      pg.addColorStop(0,`rgba(255,255,255,${pulse})`);pg.addColorStop(.3,`rgba(168,85,247,${pulse*.7})`);pg.addColorStop(1,'transparent');
      ctx.fillStyle=pg;ctx.beginPath();ctx.arc(hx,hy,pr,0,Math.PI*2);ctx.fill()}
    // The dense core that forms AFTER the pulse
    if(cycle>.3){const coreAlpha=(cycle-.3)/.7;const cr=8+coreAlpha*20;
      const cg=ctx.createRadialGradient(hx,hy,0,hx,hy,cr);cg.addColorStop(0,'rgba(255,255,255,.9)');cg.addColorStop(.5,'rgba(239,68,68,.5)');cg.addColorStop(1,'transparent');
      ctx.fillStyle=cg;ctx.beginPath();ctx.arc(hx,hy,cr,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx,hy,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='11px Inter,sans-serif';ctx.textAlign='center';
    ctx.fillText('CHAMP DE HIGGS — fond violet omniprésent',cx,cy+80);
    ctx.fillText('IMPULSION — le pulse crée un NOYAU DENSE (masse)',cx,cy+98);
    ctx.fillText('La « particule de Higgs » = la QUANTIFICATION de ce pulse',cx,cy+116);
    document.getElementById('subtitle').textContent='Higgs : le pulse qui crée la masse. Pas une particule — une IMPULSION.';
  }
  else if(mode==='force'){
    // FORCES = interference patterns at different scales
    // EM force : + and - charges
    const px=cx-140,py=cy,ex=cx+140,ey=cy;
    // Field lines
    for(let i=0;i<20;i++){const a=(i/20)*Math.PI*2;const r=30;const sx=cx+r*Math.cos(a),sy=cy+r*Math.sin(a);
      ctx.strokeStyle='rgba(245,200,80,.2)';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(px,py);
      let first=!0;for(let t=0;t<=1;t+=.04){const fx=px+(ex-px)*t,fy=py+(ey-py)*t+Math.sin(t*Math.PI*3+a)*15;first?(ctx.lineTo(fx,fy),first=!1):ctx.lineTo(fx,fy)}ctx.stroke()}
    // Charges
    const pg=ctx.createRadialGradient(px,py,3,px,py,15);pg.addColorStop(0,'rgba(255,255,255,.9)');pg.addColorStop(.4,'rgba(239,68,68,.5)');pg.addColorStop(1,'transparent');
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ef4444';ctx.font='10px Inter,sans-serif';ctx.textAlign='center';ctx.fillText('(+)',px,py-20);
    const eg=ctx.createRadialGradient(ex,ey,3,ex,ey,15);eg.addColorStop(0,'rgba(255,255,255,.9)');eg.addColorStop(.4,'rgba(59,130,246,.5)');eg.addColorStop(1,'transparent');
    ctx.fillStyle=eg;ctx.beginPath();ctx.arc(ex,ey,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3b82f6';ctx.fillText('(−)',ex,ey-20);
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='11px Inter,sans-serif';ctx.textAlign='center';
    ctx.fillText('FORCE ÉLECTROMAGNÉTIQUE = interférence de deux charges',cx,cy+60);
    ctx.fillText('Pas de photon médiateur. Juste l\'interférence.',cx,cy+78);
    document.getElementById('subtitle').textContent='Forces : l\'interférence entre charges/pôles. Aucun médiateur nécessaire.';
  }
}
function loop(){if(playing)t+=.05;draw();requestAnimationFrame(loop)}loop();
</script></body></html>
