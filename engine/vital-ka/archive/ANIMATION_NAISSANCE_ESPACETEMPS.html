<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌊 Naissance de l'Espace-Temps — Émergence Ondulatoire</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fafafa;font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh}
canvas{display:block}
#ui{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:10;flex-wrap:wrap;justify-content:center}
button{padding:8px 20px;border-radius:6px;border:1px solid #333;background:#111;color:#ccc;font-size:13px;cursor:pointer;transition:all .2s}
button:hover{border-color:#f59e0b;background:#1a1a1a;color:#fff}
button.active{background:#f59e0b;border-color:#f59e0b;color:#000;font-weight:600}
#info{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center;z-index:10}
#title{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px}
#subtitle{font-size:13px;color:#a1a1aa}
#legend{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);display:flex;gap:20px;font-size:11px;color:#a1a1aa;z-index:10}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
</style>
</head>
<body>

<div id="info">
  <div id="title">🌊 Naissance de l'Espace-Temps</div>
  <div id="subtitle">L'espace et le temps n'existent pas encore — ils vont ÉMERGER</div>
</div>

<div id="legend">
  <span><span class="legend-dot" style="background:#f59e0b"></span> Ψ₁ — onde primordiale</span>
  <span><span class="legend-dot" style="background:#22d3ee"></span> courbure émergente</span>
  <span><span class="legend-dot" style="background:#8b5cf6"></span> première dimension</span>
  <span><span class="legend-dot" style="background:#fafafa"></span> masse condensée</span>
</div>

<canvas id="c"></canvas>

<div id="ui">
  <button id="btn-play" class="active">▶ Naissance</button>
  <button id="btn-pause">⏸ Pause</button>
  <button id="btn-reset">↺ ∅ Retour au vide</button>
  <span style="color:#555">| Niveau :</span>
  <span id="level-display" style="color:#f59e0b;font-size:14px;min-width:30px">n=1</span>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
let time = 0;
let playing = true;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W/2; cy = H/2;
}
resize();
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════════════════════════
// L'émergence — 5 actes
// ═══════════════════════════════════════════════════════════════

function act(t) { return Math.min(1, Math.max(0, t)); }

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const T = time;
  const act1 = act((T - 0) / 6);   // 0-6s : le vide n'est pas vide
  const act2 = act((T - 5) / 8);   // 5-13s : la première vibration
  const act3 = act((T - 11) / 10); // 11-21s : couplage — naissance d'une direction
  const act4 = act((T - 19) / 12); // 19-31s : espace — les 3 dimensions
  const act5 = act((T - 29) / 10); // 29-39s : temps — la causalité

  // ── ACTE 1 : Le vide (0-6s) ──
  // Rien. Juste le potentiel. Quelques fluctuations quantiques infimes.
  if (act1 < 0.99) {
    const noiseAlpha = 0.03 + act1 * 0.02;
    for (let i = 0; i < 80; i++) {
      const nx = Math.random() * W;
      const ny = Math.random() * H;
      ctx.fillStyle = `rgba(245,158,11,${noiseAlpha * Math.random()})`;
      ctx.fillRect(nx, ny, 2, 2);
    }

    // Le potentiel — un point infinitésimal
    if (act1 > 0.1) {
      const glow = 3 + act1 * 6;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glow);
      grad.addColorStop(0, 'rgba(245,158,11,0.15)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx, cy, glow, 0, Math.PI*2); ctx.fill();
    }

    if (T < 0.5) {
      document.getElementById('subtitle').textContent =
        '∅ Le vide — ni espace, ni temps. Juste le potentiel.';
    } else if (T < 3) {
      document.getElementById('subtitle').textContent =
        '∅ Fluctuations du vide — le « bruit » primordial.';
    } else {
      document.getElementById('subtitle').textContent =
        '∅ Quelque chose va émerger. Mais il n\'y a encore NULLE PART où émerger.';
    }
  }

  // ── ACTE 2 : Ψ₁ — la première vibration (5-13s) ──
  if (act2 > 0) {
    // Une onde apparaît — elle n'est LOCALISÉE NULLE PART
    // car l'espace n'existe pas encore. Elle est PARTOUT et NULLE PART.
    const alpha = act2 * 0.4;

    for (let i = 0; i < 200; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * (150 * act2 + 20);
      const x = cx + dist * Math.cos(angle);
      const y = cy + dist * Math.sin(angle);

      const wave = Math.sin(dist * 0.06 - T * 0.08) * 0.5 + 0.5;
      const particleAlpha = alpha * wave * 0.6;

      ctx.fillStyle = `rgba(245,158,11,${particleAlpha})`;
      ctx.beginPath();
      ctx.arc(x, y, 1.5 + wave, 0, Math.PI*2);
      ctx.fill();
    }

    // Nom de l'onde
    if (act2 > 0.2) {
      ctx.fillStyle = `rgba(245,158,11,${act2 * 0.7})`;
      ctx.font = '18px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Ψ₁', cx, cy - 60 - act2 * 40);
    }

    if (act2 < 0.5) {
      document.getElementById('subtitle').textContent =
        '🌊 Ψ₁ apparaît — la première vibration. Pas de localisation : l\'espace n\'existe pas.';
    } else {
      document.getElementById('subtitle').textContent =
        '🌊 Ψ₁ = onde primordiale. Elle est PARTOUT. Elle EST le « où » qui n\'existe pas encore.';
    }
  }

  // ── ACTE 3 : Couplage Atangana-Oyibo — D^{1/φ}[Ψ] = G[Ψ] (11-21s) ──
  if (act3 > 0) {
    const separation = act3 * 200;
    const x1 = cx - separation/2;
    const y1 = cy;
    const x2 = cx + separation/2;
    const y2 = cy;

    // ═══════════════════════════════════════════════════════
    // CÔTÉ DROIT : Oyibo — l'ESPACE (jauge GAGUT, 1/φ)
    // ═══════════════════════════════════════════════════════
    // Visualisé comme une grille violette qui RÉSISTE à la déformation
    if (separation > 20) {
      const gridAlpha = act3 * 0.4;
      const gridSize = 25;
      // Grille déformée par la contrainte 1/φ
      for (let gx = cx - 180; gx <= cx + 180; gx += gridSize) {
        ctx.strokeStyle = `rgba(139,92,246,${gridAlpha * 0.5})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        let first = true;
        for (let gy = cy - 120; gy <= cy + 120; gy += 3) {
          const dx = Math.abs(gx - cx);
          const warp = (1 / 1.618) * 30 * Math.exp(-dx / 150) * Math.sin(gx * 0.03 + T * 0.2);
          const wy = gy + warp * act3;
          if (first) { ctx.moveTo(gx, wy); first = false; }
          else { ctx.lineTo(gx, wy); }
        }
        ctx.stroke();
      }
      // Ligne de jauge horizontale
      for (let gy = cy - 120; gy <= cy + 120; gy += gridSize) {
        ctx.strokeStyle = `rgba(139,92,246,${gridAlpha * 0.5})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        let first = true;
        for (let gx = cx - 180; gx <= cx + 180; gx += 3) {
          const dx = Math.abs(gx - cx);
          const warp = (1 / 1.618) * 30 * Math.exp(-dx / 150) * Math.cos(gx * 0.03 + T * 0.2);
          const wx = gx + warp * act3;
          if (first) { ctx.moveTo(wx, gy); first = false; }
          else { ctx.lineTo(wx, gy); }
        }
        ctx.stroke();
      }
    }

    // Label Oyibo
    if (act3 > 0.3 && act3 < 0.9) {
      ctx.fillStyle = `rgba(139,92,246,${act3 * 0.9})`;
      ctx.font = '13px Inter, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('G[Ψ] — Oyibo', cx + 120, cy - 80);
      ctx.fillText('ESPACE (1/φ)', cx + 120, cy - 62);
    }

    // ═══════════════════════════════════════════════════════
    // CÔTÉ GAUCHE : Atangana — le TEMPS (ABC, α=1/φ)
    // ═══════════════════════════════════════════════════════
    // Visualisé comme des traînées ambrées avec mémoire décroissante
    for (const [sx, sy] of [[x1, y1], [x2, y2]]) {
      const phi = 1.618;
      for (let i = 0; i < 40; i++) {
        const delay = i * 0.08;
        const tPast = T - delay;
        if (tPast < 5) continue;

        // Décroissance ABC : ~ exp(-α/(1-α) * delay^α)
        const alpha = 1 / phi;
        const abcDecay = Math.exp(-alpha / (1 - alpha) * Math.pow(Math.max(0, delay), alpha));

        const trailAlpha = act3 * abcDecay * 0.6;
        if (trailAlpha < 0.01) continue;

        const trailR = 8 + abcDecay * 40;
        const trailAngle = tPast * 0.5 + i * 0.3;
        const tx = sx + trailR * Math.cos(trailAngle);
        const ty = sy + trailR * Math.sin(trailAngle);

        ctx.fillStyle = `rgba(245,200,80,${trailAlpha})`;
        ctx.beginPath(); ctx.arc(tx, ty, 1.5, 0, Math.PI*2); ctx.fill();
      }
    }

    // Label Atangana
    if (act3 > 0.3 && act3 < 0.9) {
      ctx.fillStyle = `rgba(245,200,80,${act3 * 0.9})`;
      ctx.font = '13px Inter, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('D^{1/φ}[Ψ] — Atangana', cx - 220, cy - 80);
      ctx.fillText('TEMPS (ABC)', cx - 220, cy - 62);
    }

    // ═══════════════════════════════════════════════════════
    // LE COUPLAGE — D^{1/φ}[Ψ] = G[Ψ]
    // ═══════════════════════════════════════════════════════
    // La première dimension (ligne entre les deux masses)
    if (separation > 10) {
      // Ligne de couplage pulsante
      const couplingPulse = 0.5 + 0.5 * Math.sin(T * 3);
      const couplingAlpha = act3 * (0.3 + couplingPulse * 0.4);

      ctx.strokeStyle = `rgba(255,255,255,${couplingAlpha})`;
      ctx.lineWidth = 2 + couplingPulse;
      ctx.setLineDash([8, 4]);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.setLineDash([]);

      // Éclair au centre = le couplage se verrouille
      if (act3 > 0.45 && act3 < 0.55) {
        const flashAlpha = (1 - Math.abs(act3 - 0.5) * 20) * 0.6;
        const flashGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 50);
        flashGrad.addColorStop(0, `rgba(255,255,255,${flashAlpha})`);
        flashGrad.addColorStop(0.5, `rgba(245,200,80,${flashAlpha*0.5})`);
        flashGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = flashGrad;
        ctx.beginPath(); ctx.arc(cx, cy, 50, 0, Math.PI*2); ctx.fill();
      }

      // Équation au centre
      if (act3 > 0.5) {
        const eqAlpha = Math.min(1, (act3 - 0.5) * 5);
        ctx.fillStyle = `rgba(255,255,255,${eqAlpha * 0.9})`;
        ctx.font = 'bold 14px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('D^{1/φ}[Ψ] = G[Ψ]', cx, cy - 15);
        ctx.fillStyle = `rgba(245,200,80,${eqAlpha * 0.7})`;
        ctx.font = '11px Inter, sans-serif';
        ctx.fillText('Atangana = Oyibo', cx, cy + 5);
      }

      if (act3 > 0.6) {
        ctx.fillStyle = `rgba(139,92,246,${act3 * 0.8})`;
        ctx.font = '12px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('première dimension (x)', cx, cy + 30);
      }
    }

    // Les deux masses primordiales
    for (const [x, y] of [[x1, y1], [x2, y2]]) {
      const massGlow = 15 + act3 * 25;
      const grad = ctx.createRadialGradient(x, y, 2, x, y, massGlow);
      grad.addColorStop(0, 'rgba(255,255,255,0.8)');
      grad.addColorStop(0.3, 'rgba(245,158,11,0.5)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, massGlow, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
    }

    // L'interférence entre les deux masses = proto-gravité
    if (separation > 30) {
      for (let i = 0; i < 60; i++) {
        const t_frac = i / 60;
        const ix = x1 + (x2 - x1) * t_frac;
        const iy = cy + Math.sin(t_frac * Math.PI * 3 + T * 0.1) * 20 * act3;
        const iAlpha = act3 * 0.3 * (1 - Math.abs(t_frac - 0.5) * 2);
        ctx.fillStyle = `rgba(34,211,238,${iAlpha})`;
        ctx.beginPath(); ctx.arc(ix, iy, 2, 0, Math.PI*2); ctx.fill();
      }
    }

    // Sous-titres
    if (act3 < 0.3) {
      document.getElementById('subtitle').textContent =
        '🔗 n=2 — Deux masses émergent. À GAUCHE : le temps (Atangana, ABC). À DROITE : l\'espace (Oyibo, GAGUT).';
    } else if (act3 < 0.55) {
      document.getElementById('subtitle').textContent =
        '🔗 Le couplage se verrouille — D^{1/φ}[Ψ] = G[Ψ] — la première dimension NAÎT.';
    } else if (act3 < 0.8) {
      document.getElementById('subtitle').textContent =
        '🔗 L\'égalité est atteinte. Le temps (ambre) et l\'espace (violet) oscillent en phase. φ les relie.';
    } else {
      document.getElementById('subtitle').textContent =
        '🔗 GRAVITÉ = le couplage Atangana-Oyibo. L\'espace-temps EST cette égalité.';
    }
  }

  // ── ACTE 4 : Espace — les 3 dimensions (19-31s) ──
  if (act4 > 0) {
    // Trois masses en triangle = 3 dimensions
    const r = 80 + act4 * 60;
    const positions = [
      { x: cx, y: cy - r },
      { x: cx - r * 0.866, y: cy + r * 0.5 },
      { x: cx + r * 0.866, y: cy + r * 0.5 },
    ];

    // Grille émergente (très subtile au début)
    const gridAlpha = act4 * 0.2;
    if (gridAlpha > 0.02) {
      ctx.strokeStyle = `rgba(139,92,246,${gridAlpha})`;
      ctx.lineWidth = 0.5;
      const gs = 80;
      for (let x = cx - 300; x < cx + 300; x += gs) {
        ctx.beginPath();
        for (let y = cy - 300; y < cy + 300; y += 4) {
          if (y === cy - 300) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      for (let y = cy - 300; y < cy + 300; y += gs) {
        ctx.beginPath();
        for (let x = cx - 300; x < cx + 300; x += 4) {
          if (x === cx - 300) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }

    // Trois masses
    for (const p of positions) {
      const grad = ctx.createRadialGradient(p.x, p.y, 3, p.x, p.y, 20 + act4 * 15);
      grad.addColorStop(0, 'rgba(255,255,255,0.9)');
      grad.addColorStop(0.4, 'rgba(245,158,11,0.4)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(p.x, p.y, 20 + act4 * 15, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2); ctx.fill();
    }

    // Connexions = les 3 dimensions
    for (let i = 0; i < 3; i++) {
      const j = (i + 1) % 3;
      ctx.strokeStyle = `rgba(139,92,246,${act4 * 0.5})`;
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      ctx.beginPath();
      ctx.moveTo(positions[i].x, positions[i].y);
      ctx.lineTo(positions[j].x, positions[j].y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Label dimension
      const mx = (positions[i].x + positions[j].x) / 2;
      const my = (positions[i].y + positions[j].y) / 2;
      const labels = ['x', 'y', 'z'];
      ctx.fillStyle = `rgba(139,92,246,${act4 * 0.8})`;
      ctx.font = '11px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(labels[i], mx + 15, my - 10);
    }

    if (act4 < 0.5) {
      document.getElementById('subtitle').textContent =
        '📐 Trois masses = trois directions = l\'ESPACE tridimensionnel émerge.';
    } else {
      document.getElementById('subtitle').textContent =
        '📐 L\'espace EST la structure d\'interférence entre les masses. Pas de masses → pas d\'espace.';
    }
  }

  // ── ACTE 5 : Temps — la causalité (29-39s) ──
  if (act5 > 0) {
    // Un corps en orbite autour de la masse centrale = le TEMPS
    // Le temps, c'est le mouvement dans l'espace d'interférence
    const centerX = cx;
    const centerY = cy;
    const orbitR = 120 + act5 * 80;

    // Orbite
    ctx.strokeStyle = `rgba(34,211,238,${act5 * 0.5})`;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.arc(centerX, centerY, orbitR, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Corps en orbite
    const angle = T * 0.6;
    const bx = centerX + orbitR * Math.cos(angle);
    const by = centerY + orbitR * Math.sin(angle);

    // Traînée = flèche du temps
    for (let i = 0; i < 20; i++) {
      const ta = angle - i * 0.15;
      const tx = centerX + orbitR * Math.cos(ta);
      const ty = centerY + orbitR * Math.sin(ta);
      const taAlpha = act5 * (20 - i) / 20 * 0.5;
      ctx.fillStyle = `rgba(34,211,238,${taAlpha})`;
      ctx.beginPath(); ctx.arc(tx, ty, 2, 0, Math.PI*2); ctx.fill();
    }

    // Corps
    const bodyGlow = ctx.createRadialGradient(bx, by, 2, bx, by, 12);
    bodyGlow.addColorStop(0, 'rgba(34,211,238,0.9)');
    bodyGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bodyGlow;
    ctx.beginPath(); ctx.arc(bx, by, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI*2); ctx.fill();

    // Masse centrale
    const centralGlow = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 35);
    centralGlow.addColorStop(0, 'rgba(255,255,255,0.9)');
    centralGlow.addColorStop(0.3, 'rgba(245,158,11,0.5)');
    centralGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = centralGlow;
    ctx.beginPath(); ctx.arc(centerX, centerY, 35, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(centerX, centerY, 4, 0, Math.PI*2); ctx.fill();

    // Flèche du temps
    ctx.fillStyle = `rgba(34,211,238,${act5 * 0.9})`;
    ctx.font = '12px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('t →', bx + 20, by - 15);

    if (act5 < 0.5) {
      document.getElementById('subtitle').textContent =
        '⏳ Le mouvement dans l\'espace d\'interférence = le TEMPS. La causalité émerge.';
    } else {
      document.getElementById('subtitle').textContent =
        '⏳ Espace + Temps + Masse + Mouvement = GRAVITÉ. Tout émerge de Ψ₁.';
    }
  }

  // ── Niveau harmonique actuel ──
  let level;
  if (act1 < 0.99) level = 'n=0';
  else if (act2 < 0.99) level = 'n=1';
  else if (act3 < 0.99) level = 'n=2';
  else if (act4 < 0.99) level = 'n=3-4';
  else level = 'n=4-5';
  document.getElementById('level-display').textContent = level;
}

function loop() {
  if (playing) time += 0.05;
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('btn-play').addEventListener('click',()=>{
  playing=true; document.getElementById('btn-play').classList.add('active');
  document.getElementById('btn-pause').classList.remove('active');
});
document.getElementById('btn-pause').addEventListener('click',()=>{
  playing=false; document.getElementById('btn-pause').classList.add('active');
  document.getElementById('btn-play').classList.remove('active');
});
document.getElementById('btn-reset').addEventListener('click',()=>{
  time=0; playing=true; document.getElementById('btn-play').classList.add('active');
  document.getElementById('btn-pause').classList.remove('active');
});

loop();
</script>
</body>
</html>
