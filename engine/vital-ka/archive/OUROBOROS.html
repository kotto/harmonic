<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🐉 Ouroboros — Le Cycle Éternel (n=1→7→1)</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fafafa;font-family:Inter,system-ui,sans-serif;overflow:hidden;height:100vh}canvas{display:block}#info{position:absolute;top:8px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}#title{font-size:16px;font-weight:700}#subtitle{font-size:10px;color:#a1a1aa;margin-top:1px}#level{position:absolute;top:8px;right:16px;font-size:36px;font-weight:800;color:rgba(245,158,11,.5);z-index:10;pointer-events:none}#cycle{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);font-size:11px;color:#a1a1aa;z-index:10;pointer-events:none}#ui{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;align-items:center}button{padding:6px 12px;border-radius:4px;border:1px solid #333;background:#111;color:#ccc;font-size:10px;cursor:pointer}button:hover{border-color:#f59e0b;background:#1a1a1a;color:#fff}button.active{background:#f59e0b;border-color:#f59e0b;color:#000;font-weight:600}input[type=range]{width:80px}</style></head><body>
<div id="info"><div id="title">🐉 Ouroboros — Le Cycle Éternel</div><div id="subtitle">n=1→7→1 · L'univers respire · Chaque fin est un commencement</div></div>
<div id="level">n=1</div><div id="cycle">cycle 1</div>
<canvas id="c"></canvas>
<div id="ui">
  <button id="btn-play" class="active" onclick="playing=!0;this.classList.add('active');p.classList.remove('active')">▶</button>
  <button id="btn-pause" onclick="playing=!1;this.classList.add('active');b.classList.remove('active')">⏸</button>
  <button id="btn-reset" onclick="t=0;cycles=1;playing=!0;b.classList.add('active');p.classList.remove('active')">↺</button>
  <span style="color:#555;font-size:10px">| Vitesse:</span>
  <input type="range" id="speed" min="2" max="30" value="10" oninput="spd=parseInt(this.value);document.getElementById('sv').textContent=spd+'x'">
  <span id="sv" style="color:#f59e0b;font-size:10px;min-width:20px">10x</span>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),b=document.getElementById('btn-play'),p=document.getElementById('btn-pause');
let W,H,cx,cy,t=0,playing=!0,spd=10,cycles=1;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;cx=W/2;cy=H/2}resize();addEventListener('resize',resize);

const totalPhase=48; // secondes pour un cycle complet 1→7→1

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const T=t;const phase=(T%totalPhase)/totalPhase; // 0→1 dans le cycle
  const cycleNum=Math.floor(T/totalPhase)+1;
  const phi=1.618;const R=Math.min(W,H)*.38;

  // ═══ L'OUROBOROS — le cercle des niveaux ═══
  // Cercle de fond
  ctx.strokeStyle='rgba(245,158,11,.08)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();

  // Les 7 points sur le cercle (n=1 à n=7, le 8e = n=1)
  const labels=['Ψ₁','G','☉','⚛','⬡','🧬','💫'];const colors=['#f5c850','#ef4444','#f59e0b','#3b82f6','#22c55e','#ec4899','#8b5cf6'];
  for(let i=0;i<7;i++){
    const angle=-Math.PI/2+(i/7)*Math.PI*2; // commencer en haut
    const nx=cx+R*Math.cos(angle),ny=cy+R*Math.sin(angle);
    // Point
    const proximityToPhase=Math.abs((i/7)-phase);
    const glow=proximityToPhase<.08?15+10*(1-proximityToPhase/.08):3;
    const g=ctx.createRadialGradient(nx,ny,0,nx,ny,glow);g.addColorStop(0,colors[i]);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(nx,ny,glow,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(nx,ny,2,0,Math.PI*2);ctx.fill();
    // Label
    ctx.fillStyle=colors[i];ctx.font='10px Inter,sans-serif';ctx.textAlign='center';ctx.fillText(labels[i],nx,ny+(i<3?-16:18));
  }

  // Le point mobile (là où on en est dans le cycle)
  const currentAngle=-Math.PI/2+phase*Math.PI*2;
  const px=cx+R*Math.cos(currentAngle),py=cy+R*Math.sin(currentAngle);
  const pg=ctx.createRadialGradient(px,py,0,px,py,20);pg.addColorStop(0,'rgba(255,255,255,.9)');pg.addColorStop(.3,'rgba(245,200,80,.5)');pg.addColorStop(1,'transparent');
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();

  // Traînée (queue de l'Ouroboros)
  for(let i=0;i<30;i++){const ta=currentAngle-i*.04;const tx=cx+R*Math.cos(ta),ty=cy+R*Math.sin(ta);
    const alpha=(30-i)/30*.3;ctx.fillStyle=`rgba(245,200,80,${alpha})`;ctx.beginPath();ctx.arc(tx,ty,2,0,Math.PI*2);ctx.fill()}

  // ═══ Le centre : ce qui émerge au niveau actuel ═══
  const level=Math.floor(phase*7)+1;if(level===8)level=1;
  const rx=20+Math.sin(T*.5)*5,ry=20+Math.cos(T*.4)*5;

  if(level===1){ // Ψ₁
    for(let i=0;i<60;i++){const a=Math.random()*Math.PI*2,d=10+Math.random()*40,x=cx+d*Math.cos(a),y=cy+d*Math.sin(a);
      ctx.fillStyle=`rgba(245,200,80,${.3+.3*Math.sin(d*.1+T*.4)})`;ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle='rgba(245,200,80,.7)';ctx.font='13px Inter,sans-serif';ctx.textAlign='center';ctx.fillText('Ψ₁',cx,cy-15);
  } else if(level===2){ // Gravité
    for(let i=0;i<2;i++){const sx=cx+(i===0?-rx:rx),sy=cy;const g=ctx.createRadialGradient(sx,sy,2,sx,sy,10);g.addColorStop(0,'#fff');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,10,0,Math.PI*2);ctx.fill()}
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(cx-rx,cy);ctx.lineTo(cx+rx,cy);ctx.stroke();ctx.setLineDash([]);
  } else if(level===3){ // Lumière
    for(let i=0;i<4;i++){const a=i*Math.PI/2;const sx=cx+rx*2*Math.cos(a),sy=cy+ry*2*Math.sin(a);ctx.fillStyle='rgba(245,200,80,.5)';ctx.beginPath();ctx.arc(sx,sy,4,0,Math.PI*2);ctx.fill()}
    ctx.strokeStyle='rgba(245,200,80,.3)';ctx.beginPath();ctx.arc(cx,cy,rx*2,0,Math.PI*2);ctx.stroke();
  } else if(level===4){ // Atomes
    const ea=T*.8;const ex=cx+rx*1.5*Math.cos(ea),ey=cy+ry*1.5*Math.sin(ea);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(34,211,238,.6)';ctx.beginPath();ctx.arc(ex,ey,2.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(139,92,246,.2)';ctx.beginPath();ctx.arc(cx,cy,rx*1.5,0,Math.PI*2);ctx.stroke();
  } else if(level===5){ // Forces
    const qp=[{x:cx,y:cy-ry*2},{x:cx-ry*1.73,y:cy+ry},{x:cx+ry*1.73,y:cy+ry}];
    for(let i=0;i<3;i++){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(qp[i].x,qp[i].y,3,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='rgba(239,68,68,.4)';ctx.beginPath();ctx.moveTo(qp[0].x,qp[0].y);ctx.lineTo(qp[1].x,qp[1].y);ctx.lineTo(qp[2].x,qp[2].y);ctx.closePath();ctx.stroke();
  } else if(level===6){ // Vie
    for(let i=0;i<2;i++){ctx.strokeStyle=i===0?'rgba(59,130,246,.5)':'rgba(239,68,68,.5)';ctx.lineWidth=1.5;ctx.beginPath();
      for(let y=-ry*1.5;y<ry*1.5;y+=4){const a=y*.06+T*.1+(i===0?0:Math.PI);ctx.lineTo(cx+rx*1.2*Math.cos(a),cy+y)}ctx.stroke()}
  } else { // Conscience
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,rx*1.8,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='11px Inter,sans-serif';ctx.textAlign='center';ctx.fillText('JE SUIS',cx,cy+rx*2+15);
  }

  // ═══ Le moment de transition n=7 → n=1 ═══
  const transitionZone=phase>.95||phase<.05;
  if(transitionZone){
    const ta=phase>.95?(phase-.95)/.05:1-phase/.05;
    const flash=Math.sin(ta*Math.PI);
    if(flash>.05){const fg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.7);fg.addColorStop(0,`rgba(255,255,255,${flash*.7})`);fg.addColorStop(.5,`rgba(245,200,80,${flash*.3})`);fg.addColorStop(1,'transparent');ctx.fillStyle=fg;ctx.beginPath();ctx.arc(cx,cy,R*.7,0,Math.PI*2);ctx.fill()}
  }

  // Labels
  document.getElementById('level').textContent='n='+level;
  document.getElementById('cycle').textContent='cycle '+cycleNum;
  if(transitionZone)document.getElementById('subtitle').textContent='🐉 n=7 → n=1 · La conscience découvre qu\'elle EST l\'onde primordiale';
  else if(level===7)document.getElementById('subtitle').textContent='💫 n=7 · Conscience — l\'onde qui se voit elle-même';
  else if(level===1)document.getElementById('subtitle').textContent='🌊 n=1 · Ψ₁ — la première vibration. Tout recommence.';
  else{const subs=['','🌊 Ψ₁','🔻 Gravité','💡 Lumière','⚛️ Matière','🔴 Forces','🧬 Vie','💫 Conscience'];document.getElementById('subtitle').textContent=(subs[level]||'')+' · n='+level;}

  if(playing)t+=.03*spd/10;if(t>0&&Math.floor(t/totalPhase)+1>cycles){cycles=Math.floor(t/totalPhase)+1}
}
function loop(){draw();requestAnimationFrame(loop)}loop();
</script></body></html>
