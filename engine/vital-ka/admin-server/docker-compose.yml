

services:
  # ──────────────────────────────────────────────
  # Base de données
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vitalka-postgres
    environment:
      POSTGRES_DB: vitalka_admin
      POSTGRES_USER: ${POSTGRES_USER:-vitalka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitalka} -d vitalka_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vitalka-internal
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Cache + Queue Broker
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vitalka-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vitalka-internal
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Storage S3-compatible (MinIO)
  # ──────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: vitalka-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vitalka-internal
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # API Backend (FastAPI)
  # ──────────────────────────────────────────────
  admin-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: vitalka-admin-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vitalka}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/vitalka_admin
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-changeme}
      - MINIO_BUCKET=assets
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@vitalka.local}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ANDROID_PROJECT_PATH=/vital-ka/android
      - LOG_LEVEL=INFO
    volumes:
      - ../:/vital-ka:ro  # Accès en lecture au projet Vital KA pour build APK
      - ./app:/app/app:ro  # Code source (read-only en prod)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - vitalka-internal
      - vitalka-external
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ──────────────────────────────────────────────
  # Worker Celery (tâches async)
  # ──────────────────────────────────────────────
  admin-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vitalka}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/vitalka_admin
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-changeme}
      - MINIO_BUCKET=assets
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme-in-production}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@vitalka.local}
      - ANDROID_PROJECT_PATH=/vital-ka/android
      - LOG_LEVEL=INFO
    volumes:
      - ../:/vital-ka:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - vitalka-internal
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ──────────────────────────────────────────────
  # Scheduler Celery Beat (tâches périodiques)
  # ──────────────────────────────────────────────
  admin-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: vitalka-admin-scheduler
    command: celery -A app.tasks.celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vitalka}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/vitalka_admin
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-changeme}
      - MINIO_BUCKET=assets
      - LOG_LEVEL=INFO
    volumes:
      - ../:/vital-ka:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vitalka-internal
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Frontend (Nginx + React build)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: vitalka-frontend
    depends_on:
      - admin-api
    networks:
      - vitalka-internal
      - vitalka-external
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Reverse Proxy + TLS (Nginx)
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vitalka-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - admin-api
      - frontend
    networks:
      - vitalka-external
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Certbot (Let's Encrypt)
  # ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: vitalka-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c '
        trap exit TERM;
        while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;
      '
    networks:
      - vitalka-external
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Monitoring: Prometheus
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: vitalka-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - vitalka-internal
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Monitoring: Grafana
  # ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: vitalka-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - vitalka-internal
      - vitalka-external
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Logs: Loki
  # ──────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: vitalka-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - vitalka-internal
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Logs: Promtail (agent)
  # ──────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: vitalka-promtail
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - ./docker:/app/docker:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - vitalka-internal
    restart: unless-stopped

networks:
  vitalka-internal:
    driver: bridge
    internal: true
  vitalka-external:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data: