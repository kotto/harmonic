[project]
name = "vitalka-admin"
version = "1.0.0"
description = "Vital KA Administration Server - Doctor registry, version management, system admin"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = {text = "Proprietary"}
authors = [{name = "Vital KA Team"}]

dependencies = [
    # FastAPI & Web
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "gunicorn==23.0.0",

    # Database
    "sqlalchemy==2.0.34",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",

    # Redis & Cache
    "redis==5.0.8",

    # Auth & Security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "bcrypt==4.2.0",

    # Validation & Settings
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "pydantic-extra-types==2.10.0",
    "email-validator==2.2.0",

    # MinIO / S3
    "minio==7.2.10",

    # Celery (async tasks)
    "celery==5.4.0",
    "redbeat==0.0.1",  # Scheduler persistant dans Redis

    # Email
    "aiosmtplib==3.0.1",
    "jinja2==3.1.4",

    # HTTP Client
    "httpx==0.27.2",

    # Monitoring
    "prometheus-client==0.20.0",
    "structlog==24.1.0",

    # Utils
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "croniter==6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "faker==25.2.0",
    "black==24.8.0",
    "ruff==0.6.5",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "PIE", "PT", "QF", "RUF", "ERA", "PL", "TRY", "ARG", "PTH", "NPY", "PERF", "TD", "FURB"]
ignore = ["S101", "S106", "S311", "B008", "B009", "B011", "TRY003"]
fixable = ["ALL"]
unfixable = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]