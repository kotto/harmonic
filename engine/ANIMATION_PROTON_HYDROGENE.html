<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌊 Du Proton à l'Atome d'Hydrogène — Émergence Ondulatoire</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0b;color:#fafafa;font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center}
canvas{display:block}
#ui{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;z-index:10}
button{padding:10px 24px;border-radius:8px;border:1px solid #3d3528;background:#1f1b18;color:#fafafa;font-size:14px;cursor:pointer;transition:all .2s}
button:hover{border-color:#8b5cf6;background:#2a2520}
button.active{background:#8b5cf6;border-color:#8b5cf6;color:white}
#info{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center;z-index:10}
#title{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
#subtitle{font-size:14px;color:#a1a1aa}
#phase-indicator{position:absolute;top:50%;right:30px;transform:translateY(-50%);font-size:12px;color:#a1a1aa;text-align:right;line-height:1.8}
.step-label{position:absolute;font-size:13px;color:#8b5cf6;font-weight:600;opacity:0;transition:opacity .5s}
#step1{top:15%;left:20%}
#step2{top:35%;left:50%}
#step3{top:55%;left:50%}
#step4{top:40%;left:65%}
</style>
</head>
<body>

<div id="info">
  <div id="title">🌊 Du Proton à l'Atome d'Hydrogène</div>
  <div id="subtitle">Émergence ondulatoire — ψ = Σ Hₙ·(Ψ₁)ⁿ</div>
</div>

<div id="phase-indicator">
  <div>Proton : <span id="proton-phase">φ=0°</span></div>
  <div>Électron : <span id="electron-phase">φ=0°</span></div>
  <div>Δφ : <span id="delta-phase">0°</span></div>
  <div>Cohérence : <span id="coherence">1.00</span></div>
</div>

<div class="step-label" id="step1">① Le proton — onde primordiale</div>
<div class="step-label" id="step2">② L'électron apparaît — superposition</div>
<div class="step-label" id="step3">③ Interférence — liaison hydrogène</div>
<div class="step-label" id="step4">④ Atome d'hydrogène — Ψ = Ψ_p ⊕ Ψ_e</div>

<canvas id="c"></canvas>

<div id="ui">
  <button id="btn-play" class="active">▶ Lecture</button>
  <button id="btn-pause">⏸ Pause</button>
  <button id="btn-reset">↺ Reset</button>
  <span style="color:#a1a1aa;font-size:12px">| Phase : </span>
  <input type="range" id="phase-slider" min="0" max="360" value="0" style="width:120px">
  <span id="phase-val" style="color:#8b5cf6;font-size:13px;min-width:35px">0°</span>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// ANIMATION : Proton → Hydrogène (émergence ondulatoire)
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cx, cy;
let time = 0;
let playing = true;
let manualPhase = 0;
let useManualPhase = false;
let phase = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// ── Ondes ─────────────────────────────────────────────────────

function protonWave(x, y, t, ph) {
  // Proton = onde stationnaire centrale (amplitude 1, fréquence φ)
  const r = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
  const freq = 1.618; // φ
  const decay = Math.exp(-r / 120);
  const wave = Math.cos(freq * r * 0.05 - t * 0.02 + ph);
  return 0.6 * decay * wave;
}

function electronWave(x, y, t, ph, intensity) {
  // Électron = onde orbitale (Bohr radius ~ 100px, fréquence 1/φ)
  const r = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
  const orbit = 100;
  const spread = 40;
  const freq = 0.618; // 1/φ
  const gaussian = Math.exp(-((r - orbit) ** 2) / (2 * spread * spread));
  const angle = Math.atan2(y - cy, x - cx);
  const wave = Math.cos(freq * angle * 8 - t * 0.03 + ph);
  return intensity * gaussian * wave;
}

function hydrogenOrbital(x, y, t, ph) {
  // Atome H = superposition proton + électron (orbitale 1s)
  const r = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
  const a0 = 100; // Bohr radius scaled
  const psi = (1 / Math.sqrt(Math.PI * a0 ** 3)) * Math.exp(-r / a0);
  const wave = Math.cos(r * 0.04 - t * 0.015 + ph);
  return psi * 120 * wave;
}

// ── Rendu ──────────────────────────────────────────────────────

function draw() {
  ctx.fillStyle = '#0a0a0b';
  ctx.fillRect(0, 0, W, H);

  // Grille subtile
  ctx.strokeStyle = 'rgba(39,39,43,0.3)';
  ctx.lineWidth = 0.5;
  const gs = 50;
  for (let x = gs; x < W; x += gs) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = gs; y < H; y += gs) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = 'rgba(139,92,246,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();

  // Cercle de Bohr
  ctx.strokeStyle = 'rgba(139,92,246,0.2)';
  ctx.setLineDash([4, 8]);
  ctx.beginPath(); ctx.arc(cx, cy, 100, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // Label
  ctx.fillStyle = 'rgba(139,92,246,0.3)';
  ctx.font = '11px Inter, sans-serif';
  ctx.fillText('rayon de Bohr (a₀)', cx + 105, cy - 5);

  // Phase actuelle
  const animPhase = useManualPhase ? (manualPhase * Math.PI / 180) : (time * 0.02);
  phase = animPhase;

  // Intensité électron (0→1 sur les 6 premières secondes, puis 1)
  const electronIntensity = Math.min(1, Math.max(0, (time - 2) / 4));

  // Rendu pixel par pixel (tous les 3px pour la perf)
  const step = 3;
  for (let x = 0; x < W; x += step) {
    for (let y = 0; y < H; y += step) {
      const pw = protonWave(x, y, time, 0);
      const ew = electronWave(x, y, time, animPhase, electronIntensity);

      // Superposition = proton + électron (avec interférence)
      const superposition = pw + ew;

      // À partir de t=4s, l'orbitale hydrogène émerge
      const hw = time > 4 ? hydrogenOrbital(x, y, time, animPhase) * Math.min(1, (time - 4) / 4) : 0;

      // Valeur finale = superposition qui converge vers l'orbitale
      const blend = Math.min(1, (time - 4) / 6);
      const value = superposition * (1 - blend) + hw * blend;

      // Couleur : amplitude positive = violet, négative = cyan
      const intensity = Math.abs(value);
      const alpha = Math.min(1, intensity * 0.8);

      if (alpha < 0.02) continue;

      if (value > 0) {
        const r = Math.floor(139 + intensity * 60);
        const g = Math.floor(92 - intensity * 30);
        const b = Math.floor(246 - intensity * 40);
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      } else {
        const r = Math.floor(34 - intensity * 10);
        const g = Math.floor(211 - intensity * 30);
        const b = Math.floor(238 + intensity * 10);
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      }
      ctx.fillRect(x, y, step, step);
    }
  }

  // ── Noyau (proton) ──
  const nucleusGlow = 20 + 10 * Math.sin(time * 0.05);
  const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, nucleusGlow);
  grad.addColorStop(0, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.3, 'rgba(168,127,251,0.6)');
  grad.addColorStop(1, 'rgba(139,92,246,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx, cy, nucleusGlow, 0, Math.PI * 2); ctx.fill();

  // Point central
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();

  // ── Orbite électron (si visible) ──
  if (electronIntensity > 0.1) {
    const orbitR = 100;
    const eAngle = time * 0.8 + animPhase;
    const ex = cx + orbitR * Math.cos(eAngle);
    const ey = cy + orbitR * Math.sin(eAngle);

    // Traînée
    for (let i = 0; i < 12; i++) {
      const ta = eAngle - i * 0.15;
      const tx = cx + orbitR * Math.cos(ta);
      const ty = cy + orbitR * Math.sin(ta);
      const taAlpha = (12 - i) / 12 * 0.4 * electronIntensity;
      ctx.fillStyle = `rgba(34,211,238,${taAlpha})`;
      ctx.beginPath(); ctx.arc(tx, ty, 2, 0, Math.PI * 2); ctx.fill();
    }

    // Électron
    const eGlow = 8 + 4 * Math.sin(time * 0.1);
    const eGrad = ctx.createRadialGradient(ex, ey, 1, ex, ey, eGlow);
    eGrad.addColorStop(0, 'rgba(34,211,238,0.9)');
    eGrad.addColorStop(1, 'rgba(34,211,238,0)');
    ctx.fillStyle = eGrad;
    ctx.beginPath(); ctx.arc(ex, ey, eGlow, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#22d3ee';
    ctx.beginPath(); ctx.arc(ex, ey, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  // ── Indicateurs ──
  document.getElementById('proton-phase').textContent = `φ=0°`;
  document.getElementById('electron-phase').textContent = `φ=${Math.round(animPhase * 180/Math.PI) % 360}°`;
  const dphi = Math.abs(animPhase % (2*Math.PI));
  const degDisplay = Math.round(Math.min(dphi, 2*Math.PI - dphi) * 180/Math.PI);
  document.getElementById('delta-phase').textContent = `${degDisplay}°`;
  const coh = Math.cos(animPhase);
  document.getElementById('coherence').textContent = (Math.abs(coh)).toFixed(2);

  // ── Étiquettes d'étape ──
  const stepOpacity = (n, tStart, tEnd) => {
    if (time < tStart) return 0;
    if (time > tEnd) return 0;
    const mid = (tStart + tEnd) / 2;
    return Math.min(1, (time - tStart) / (mid - tStart)) * Math.min(1, (tEnd - time) / (tEnd - mid));
  };

  document.getElementById('step1').style.opacity = stepOpacity(1, 0, 4);
  document.getElementById('step2').style.opacity = stepOpacity(2, 2, 7);
  document.getElementById('step3').style.opacity = stepOpacity(3, 5, 12);
  document.getElementById('step4').style.opacity = stepOpacity(4, 8, 16);

  // ── Sous-titre dynamique ──
  if (time < 3) {
    document.getElementById('subtitle').textContent = '① Le proton — onde primordiale Ψ₁';
  } else if (time < 6) {
    document.getElementById('subtitle').textContent = '② ψ_électron ⊕ ψ_proton — superposition';
  } else if (time < 10) {
    document.getElementById('subtitle').textContent = '③ Interférence — cos(Δφ) détermine la liaison';
  } else {
    document.getElementById('subtitle').textContent = '④ H = Ψ_p ⊕ Ψ_e — l\'atome émerge de l\'interférence';
  }
}

// ── Boucle ─────────────────────────────────────────────────────

function loop() {
  if (playing && !useManualPhase) {
    time += 0.05;
  }
  draw();

  // Mise à jour affichage phase
  const deg = useManualPhase ? manualPhase : Math.round((time * 0.02 * 180 / Math.PI) % 360);
  document.getElementById('phase-val').textContent = deg + '°';
  document.getElementById('phase-slider').value = useManualPhase ? manualPhase : deg % 360;

  requestAnimationFrame(loop);
}

// ── Contrôles ──────────────────────────────────────────────────

document.getElementById('btn-play').addEventListener('click', () => {
  playing = true;
  useManualPhase = false;
  document.getElementById('btn-play').classList.add('active');
  document.getElementById('btn-pause').classList.remove('active');
});

document.getElementById('btn-pause').addEventListener('click', () => {
  playing = false;
  useManualPhase = true;
  manualPhase = Math.round((time * 0.02 * 180 / Math.PI) % 360);
  document.getElementById('btn-pause').classList.add('active');
  document.getElementById('btn-play').classList.remove('active');
});

document.getElementById('btn-reset').addEventListener('click', () => {
  time = 0;
  manualPhase = 0;
  useManualPhase = false;
  playing = true;
  document.getElementById('btn-play').classList.add('active');
  document.getElementById('btn-pause').classList.remove('active');
  document.getElementById('phase-slider').value = 0;
});

document.getElementById('phase-slider').addEventListener('input', (e) => {
  manualPhase = parseInt(e.target.value);
  useManualPhase = true;
  playing = false;
  document.getElementById('btn-pause').classList.add('active');
  document.getElementById('btn-play').classList.remove('active');
});

// ── Démarrage ──────────────────────────────────────────────────

loop();
</script>
</body>
</html>
