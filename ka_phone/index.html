<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>KA Phone</title>
<link rel="stylesheet" href="www/ka-ui.css">
<link rel="manifest" href="www/manifest.json">
<style>
#ka-app{position:relative;width:100%;max-width:420px;height:100vh;margin:0 auto;overflow:hidden;background:#000}
.ka-screen{position:absolute;inset:0;display:none;background-size:cover;background-position:center;background-repeat:no-repeat}
.ka-screen.active{display:block}
#ka-nav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px 16px 16px;z-index:100;background:linear-gradient(transparent,rgba(0,0,0,0.8))}
.ka-nav-btn{background:none;border:none;color:rgba(255,255,255,0.45);font-size:1.6em;cursor:pointer;padding:6px 12px;transition:all 0.2s}
.ka-nav-btn.active{color:#d4a843;transform:scale(1.15)}
.ka-nav-btn:active{transform:scale(0.9)}
#chat-overlay{position:absolute;bottom:140px;left:5%;right:5%;top:12%;overflow-y:auto;z-index:50;padding:8px}
#chat-overlay .km{background:rgba(20,20,30,0.85);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:0.85em;max-width:85%;color:#f0f0f5;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#chat-overlay .km-user{margin-left:auto;background:rgba(212,168,67,0.15);border:1px solid rgba(212,168,67,0.2)}
#chat-overlay .km-bot{margin-right:auto}
#chat-input-row{position:absolute;bottom:80px;left:5%;right:5%;display:flex;gap:8px;z-index:50}
#chat-input-row input{flex:1;padding:10px 16px;background:rgba(20,20,30,0.85);border:1px solid rgba(255,255,255,0.1);border-radius:24px;color:#f0f0f5;font-size:0.9em;outline:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#chat-input-row input:focus{border-color:#d4a843}
#chat-input-row button{width:42px;height:42px;border-radius:50%;background:#d4a843;color:#0a0a0f;border:none;font-size:1.1em;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#chat-input-row button:active{background:#f0c96e}
#mic-btn{position:absolute;bottom:145px;left:12px;z-index:50;background:rgba(20,20,30,0.7);border:1px solid rgba(255,255,255,0.1);border-radius:50%;width:38px;height:38px;font-size:1.1em;cursor:pointer;color:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#mic-btn.listening{color:#ff4757;border-color:#ff4757}
</style>
</head>
<body>
<div id="ka-app">
  <div class="ka-screen active" id="screen-home" style="background-image:url(www/img/screen_home.png)"></div>
  <div class="ka-screen" id="screen-chat" style="background-image:url(www/img/screen_chat.png)">
    <div id="chat-overlay"><div class="km km-bot"><b>KA</b> — Ton Double Numérique</div></div>
    <button id="mic-btn" onclick="toggleVoice()" title="Micro">🎤</button>
    <div id="chat-input-row">
      <input id="ka-inp" placeholder="Parle à KA..." autocomplete="off">
      <button id="ka-send">▶</button>
    </div>
  </div>
  <div class="ka-screen" id="screen-camera" style="background-image:url(www/img/screen_camera.png)"></div>
  <div class="ka-screen" id="screen-calls" style="background-image:url(www/img/screen_calls.png)"></div>
  <div class="ka-screen" id="screen-system" style="background-image:url(www/img/screen_system.png)"></div>
  <nav id="ka-nav">
    <button class="ka-nav-btn active" onclick="showScreen('home')">🏠</button>
    <button class="ka-nav-btn" onclick="showScreen('calls')">📞</button>
    <button class="ka-nav-btn" onclick="showScreen('chat')">💬</button>
    <button class="ka-nav-btn" onclick="showScreen('camera')">📷</button>
    <button class="ka-nav-btn" onclick="showScreen('system')">⚙️</button>
  </nav>
</div>
<script src="www/ka-ui-new.js"></script>
</body>
</html>
