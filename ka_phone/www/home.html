<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KA PHONE — Home</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Manrope:wght@300;400;500&family=JetBrains+Mono:wght@200;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-0: #070514;
            --bg-1: #0a0820;
            --bg-2: #140c2e;
            --ink-0: #eaf6ff;
            --ink-1: #b8c6dc;
            --ink-2: #7a86a8;
            --accent-a: #3ef0d8;
            --accent-b: #7a5cff;
            --accent-c: #c59cff;
            --stroke: rgba(200, 220, 255, 0.09);
            --glass: rgba(10, 8, 32, 0.55);
            --font-display: 'Space Grotesk', system-ui, sans-serif;
            --font-ui: 'Manrope', 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-ui);
            background: var(--bg-0);
            color: var(--ink-0);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }
        
        /* Background */
        .bg-gradient {
            position: fixed; inset: 0; z-index: 0;
            background: linear-gradient(180deg, #020713 0%, #0a0820 50%, #050B20 100%);
        }
        
        .bg-neural-glow {
            position: fixed;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(122,92,255,0.10), rgba(62,240,216,0.04), transparent 70%);
            z-index: 0;
            animation: neuralPulse 8s ease-in-out infinite;
        }
        
        @keyframes neuralPulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
        }
        
        /* Status bar */
        .status-bar {
            position: relative; z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px 0;
            font-size: 13px;
            font-family: var(--font-mono);
            color: var(--ink-1);
        }
        
        .sb-right {
            display: flex; align-items: center; gap: 6px;
        }
        
        .sb-battery {
            width: 24px; height: 11px;
            border: 1px solid var(--ink-1);
            border-radius: 3px;
            padding: 2px;
            opacity: 0.6;
        }
        
        .sb-battery-fill {
            width: 14px; height: 5px;
            background: var(--accent-a);
            border-radius: 1px;
        }
        
        /* Main screen */
        .home-screen {
            position: relative; z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh; height: 100dvh;
            padding: 0 28px;
        }
        
        /* Greeting area — centered */
        .greeting-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 12px;
        }
        
        .greeting-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(122,92,255,0.4), rgba(62,240,216,0.15));
            border: 1px solid var(--stroke);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            box-shadow: 0 0 30px rgba(122,92,255,0.2);
        }
        
        .greeting-avatar svg {
            width: 28px; height: 28px;
            stroke: var(--accent-a);
            opacity: 0.9;
        }
        
        .greeting-name {
            font-family: var(--font-display);
            font-size: 17px;
            font-weight: 600;
            color: var(--ink-0);
            letter-spacing: -0.3px;
        }
        
        .greeting-message {
            font-family: var(--font-ui);
            font-size: 24px;
            font-weight: 300;
            color: var(--ink-1);
            line-height: 1.4;
            max-width: 300px;
        }
        
        .greeting-message strong {
            font-weight: 500;
            color: var(--accent-c);
        }
        
        /* Suggestion chips */
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            max-width: 360px;
        }
        
        .chip {
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 400;
            color: var(--ink-1);
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--stroke);
            border-radius: 100px;
            padding: 10px 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .chip:hover, .chip:active {
            border-color: rgba(62,240,216,0.3);
            color: var(--accent-a);
            box-shadow: 0 0 15px rgba(62,240,216,0.1);
        }
        
        /* Prompt area — bottom */
        .prompt-area {
            padding: 0 0 32px;
        }
        
        .prompt-container {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--stroke);
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            box-shadow: 0 0 30px rgba(122,92,255,0.08);
            transition: all 0.3s ease;
        }
        
        .prompt-container:focus-within {
            border-color: rgba(62,240,216,0.3);
            box-shadow: 0 0 40px rgba(62,240,216,0.12), 0 0 80px rgba(122,92,255,0.06);
        }
        
        .prompt-icon {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: rgba(62,240,216,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .prompt-icon svg {
            width: 18px; height: 18px;
            stroke: var(--accent-a);
        }
        
        .prompt-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            font-family: var(--font-ui);
            font-size: 16px;
            font-weight: 400;
            color: var(--ink-0);
            caret-color: var(--accent-a);
        }
        
        .prompt-input::placeholder {
            color: var(--ink-2);
            opacity: 0.6;
        }
        
        .prompt-send {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--accent-a);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(62,240,216,0.3);
        }
        
        .prompt-send svg {
            width: 16px; height: 16px;
            stroke: var(--bg-0);
        }
        
        .prompt-send:active {
            transform: scale(0.92);
            box-shadow: 0 0 25px rgba(62,240,216,0.5);
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-neural-glow"></div>
    
    <div class="home-screen">
        
        <!-- Status Bar -->
        <div class="status-bar">
            <span id="statusTime">14:03</span>
            <div class="sb-right">
                <div class="sb-battery"><div class="sb-battery-fill"></div></div>
            </div>
        </div>
        
        <!-- Greeting -->
        <div class="greeting-area">
            <div class="greeting-avatar">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
            </div>
            <div class="greeting-message">
                Bonjour,<br>que puis-je faire<br><strong>pour toi aujourd'hui ?</strong>
            </div>
            
            <!-- Suggestions -->
            <div class="suggestions">
                <div class="chip" onclick="fillPrompt('Quel temps fait-il ?')">☁️ Météo</div>
                <div class="chip" onclick="fillPrompt('Calcule 127 + 58')">🔢 Calculer</div>
                <div class="chip" onclick="fillPrompt('Rappelle-moi d\'acheter du pain')">⏰ Rappel</div>
                <div class="chip" onclick="fillPrompt('Raconte-moi une histoire')">✨ Imaginer</div>
            </div>
        </div>
        
        <!-- Prompt -->
        <div class="prompt-area">
            <div class="prompt-container">
                <div class="prompt-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M8 12l3 3 5-6"/>
                    </svg>
                </div>
                <input type="text" class="prompt-input" id="promptInput" 
                       placeholder="Écris ou dis quelque chose..."
                       autocomplete="off">
                <button class="prompt-send" onclick="sendPrompt()">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Live clock in status bar
        function updateTime() {
            const now = new Date();
            document.getElementById('statusTime').textContent = 
                String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }
        updateTime();
        setInterval(updateTime, 30000);
        
        // Fill prompt from chip
        function fillPrompt(text) {
            const input = document.getElementById('promptInput');
            input.value = text;
            input.focus();
        }
        
        // Send prompt
        function sendPrompt() {
            const input = document.getElementById('promptInput');
            const text = input.value.trim();
            if (!text) return;
            
            // Visual feedback
            const btn = document.querySelector('.prompt-send');
            btn.style.transform = 'scale(0.85)';
            setTimeout(() => btn.style.transform = '', 150);
            
            console.log('📤 Prompt:', text);
            // Here we would call the KA Phone engine
            input.value = '';
            input.focus();
        }
        
        // Enter key to send
        document.getElementById('promptInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendPrompt();
        });
    </script>
</body>
</html>
