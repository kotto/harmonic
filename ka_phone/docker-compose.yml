version: '3.8'

services:
  kaphone:
    build: .
    container_name: kaphone
    restart: unless-stopped
    ports:
      - "127.0.0.1:8420:8420"  # Only accessible locally (Cloudflare Tunnel will expose it)
    volumes:
      - kaphone_data:/app/data    # Persistent data (memory, reminders, notes)
      - ./models:/app/ka_phone/models  # Modeles GGUF (2.4 Go, montes en volume pour ne pas alourdir l'image Docker)
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8420/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared
    depends_on:
      kaphone:
        condition: service_healthy
    network_mode: host  # Needed to access kaphone on localhost

volumes:
  kaphone_data: