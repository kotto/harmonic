<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonic AI - Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: white; font-weight: 700;
        }
        .logo-text {
            font-size: 20px; font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .status-badge {
            display: flex; align-items: center; gap: 6px;
            font-size: 13px; color: var(--text-secondary);
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--secondary);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
            overflow: hidden;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.assistant { align-self: flex-start; }
        .message.system { align-self: center; }
        .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
        }
        .message.user .avatar { background: var(--primary); }
        .message.assistant .avatar { background: linear-gradient(135deg, var(--primary), var(--secondary)); }
        .message.system .avatar { background: var(--border); }
        .bubble {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.6;
            position: relative;
        }
        .message.user .bubble {
            background: var(--primary);
            border-bottom-right-radius: 4px;
        }
        .message.assistant .bubble {
            background: var(--card);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .message.system .bubble {
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text-secondary);
            font-size: 12px;
            text-align: center;
        }
        .bubble .timestamp {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
            opacity: 0.7;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }
        .typing-indicator span {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%,60%,100% { opacity: 0.3; } 30% { opacity: 1; } }
        .input-area {
            padding: 16px 0;
            flex-shrink: 0;
        }
        .input-wrapper {
            display: flex;
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px;
            transition: border-color 0.3s;
        }
        .input-wrapper:focus-within { border-color: var(--primary); }
        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 8px;
            resize: none;
            outline: none;
            min-height: 24px;
            max-height: 120px;
        }
        .input-wrapper textarea::placeholder { color: var(--text-secondary); }
        .send-btn {
            background: var(--primary);
            border: none;
            color: white;
            width: 40px; height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .send-btn:hover { background: var(--primary-dark); transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .send-btn svg { width: 20px; height: 20px; }
        .info-bar {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .latency-badge {
            display: flex; align-items: center; gap: 4px;
        }
        .latency-badge .value { color: var(--secondary); font-weight: 600; }
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-secondary);
        }
        .welcome-screen .icon {
            font-size: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .welcome-screen h2 {
            font-size: 24px;
            color: var(--text);
            font-weight: 600;
        }
        .welcome-screen p { text-align: center; max-width: 400px; line-height: 1.6; }
        .suggestions {
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
            margin-top: 8px;
        }
        .suggestion-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .suggestion-btn:hover {
            border-color: var(--primary);
            color: var(--text);
            background: rgba(99,102,241,0.1);
        }
        .error-message {
            color: #ef4444;
            font-size: 12px;
            padding: 4px 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">H</div>
            <span class="logo-text">Harmonic AI</span>
        </div>
        <div class="status-badge">
            <span class="status-dot"></span>
            <span id="statusText">Connecté</span>
        </div>
    </header>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="welcome-screen" id="welcomeScreen">
                <div class="icon">✦</div>
                <h2>Harmonic AI Assistant</h2>
                <p>Assistant intelligent basé sur la théorie harmonique unifiée.<br>Latence < 1ms • Précision 100% MMLU/MATH</p>
                <div class="suggestions">
                    <button class="suggestion-btn" onclick="sendSuggestion('Bonjour, qui es-tu ?')">👋 Qui es-tu ?</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Explique la théorie harmonique')">🔬 Théorie harmonique</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Quels sont tes scores aux benchmarks ?')">📊 Benchmarks</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Comment fonctionne la latence ?')">⚡ Latence</button>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="promptInput" placeholder="Posez votre question à Harmonic AI..." rows="1" 
                    oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
            <div class="info-bar">
                <span class="latency-badge">⚡ Latence: <span class="value" id="latencyDisplay">< 1ms</span></span>
                <span id="charCount">0 caractères</span>
            </div>
            <div id="errorDisplay" class="error-message"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:9000';
        let isProcessing = false;
        let messageCount = 0;

        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesDiv = document.getElementById('messages');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const latencyDisplay = document.getElementById('latencyDisplay');
        const charCount = document.getElementById('charCount');
        const errorDisplay = document.getElementById('errorDisplay');
        const statusText = document.getElementById('statusText');

        // Auto-resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
            charCount.textContent = textarea.value.length + ' caractères';
            sendBtn.disabled = textarea.value.trim().length === 0;
        }

        // Handle Enter key
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // Send suggestion
        function sendSuggestion(text) {
            promptInput.value = text;
            autoResize(promptInput);
            sendMessage();
        }

        // Add message to chat
        function addMessage(role, content, metadata = {}) {
            welcomeScreen.style.display = 'none';
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? 'U' : role === 'system' ? '!' : 'H';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            if (role === 'assistant' && metadata.isTyping) {
                const typing = document.createElement('div');
                typing.className = 'typing-indicator';
                typing.innerHTML = '<span></span><span></span><span></span>';
                bubble.appendChild(typing);
            } else {
                bubble.textContent = content;
                
                if (metadata.timestamp) {
                    const ts = document.createElement('div');
                    ts.className = 'timestamp';
                    ts.textContent = metadata.timestamp;
                    bubble.appendChild(ts);
                }
            }
            
            msgDiv.appendChild(avatar);
            msgDiv.appendChild(bubble);
            messagesDiv.appendChild(msgDiv);
            
            // Scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            return msgDiv;
        }

        // Update typing to actual content
        function updateTypingToContent(msgDiv, content, metadata = {}) {
            const bubble = msgDiv.querySelector('.bubble');
            bubble.innerHTML = '';
            bubble.textContent = content;
            
            if (metadata.timestamp) {
                const ts = document.createElement('div');
                ts.className = 'timestamp';
                ts.textContent = metadata.timestamp;
                bubble.appendChild(ts);
            }
            
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Send message
        async function sendMessage() {
            const prompt = promptInput.value.trim();
            if (!prompt || isProcessing) return;

            isProcessing = true;
            sendBtn.disabled = true;
            errorDisplay.textContent = '';

            // Add user message
            const now = new Date();
            addMessage('user', prompt, {
                timestamp: now.toLocaleTimeString('fr-FR')
            });

            // Clear input
            promptInput.value = '';
            autoResize(promptInput);

            // Add typing indicator
            const typingMsg = addMessage('assistant', '', { isTyping: true });

            try {
                const startTime = performance.now();
                
                const response = await fetch(`${API_URL}/api/chat/public`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        temperature: 0.0,
                        max_tokens: 1000
                    })
                });

                const endTime = performance.now();
                const latency = (endTime - startTime) / 1000;

                // Update latency display
                if (latency < 0.001) {
                    latencyDisplay.textContent = '< 1ms';
                } else if (latency < 1) {
                    latencyDisplay.textContent = (latency * 1000).toFixed(0) + ' µs';
                } else {
                    latencyDisplay.textContent = latency.toFixed(2) + 's';
                }

                if (!response.ok) {
                    throw new Error(`Erreur ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    const now2 = new Date();
                    updateTypingToContent(typingMsg, data.response, {
                        timestamp: now2.toLocaleTimeString('fr-FR')
                    });
                    messageCount++;
                } else {
                    throw new Error(data.response || 'Erreur inconnue');
                }

            } catch (error) {
                const now2 = new Date();
                updateTypingToContent(typingMsg, 
                    `❌ Désolé, une erreur est survenue : ${error.message}`, {
                    timestamp: now2.toLocaleTimeString('fr-FR')
                });
                errorDisplay.textContent = `Erreur: ${error.message}`;
            }

            isProcessing = false;
            sendBtn.disabled = promptInput.value.trim().length === 0;
        }

        // Check backend health
        async function checkHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                if (response.ok) {
                    statusText.textContent = 'Connecté';
                    document.querySelector('.status-dot').style.background = 'var(--secondary)';
                } else {
                    statusText.textContent = 'Service indisponible';
                    document.querySelector('.status-dot').style.background = '#ef4444';
                }
            } catch (e) {
                statusText.textContent = 'Déconnecté';
                document.querySelector('.status-dot').style.background = '#ef4444';
            }
        }

        // Initial health check
        checkHealth();
        setInterval(checkHealth, 10000);
    </script>
</body>
</html>
