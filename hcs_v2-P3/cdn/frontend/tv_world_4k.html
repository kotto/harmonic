<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCS CDN - TV Broadcast 4K</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #fff; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .header p { font-size: 1.1em; opacity: 0.9; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .stat-label { font-size: 0.9em; opacity: 0.8; margin-bottom: 10px; }
        .stat-value { font-size: 2em; font-weight: bold; color: #4ade80; }
        .video-player { background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .player-placeholder { width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); }
        .player-icon { font-size: 4em; opacity: 0.5; }
        .controls { display: flex; gap: 10px; padding: 20px; background: rgba(0,0,0,0.3); }
        .btn { padding: 10px 20px; background: #4ade80; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .btn:hover { background: #22c55e; transform: translateY(-2px); }
        .btn.secondary { background: #3b82f6; color: #fff; }
        .btn.secondary:hover { background: #2563eb; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .info-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; border-left: 3px solid #4ade80; }
        .info-label { font-size: 0.85em; opacity: 0.7; margin-bottom: 5px; }
        .info-value { font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📺 TV Broadcast 4K</h1>
            <p>Service de diffusion vidéo en 4K haute qualité</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Résolution</div>
                <div class="stat-value">4K (2160p)</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Débit Bitrate</div>
                <div class="stat-value">25 Mbps</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">SLA</div>
                <div class="stat-value">99.95%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Compression</div>
                <div class="stat-value">8:1</div>
            </div>
        </div>

        <div class="video-player">
            <div class="player-placeholder">
                <div class="player-icon">▶️</div>
            </div>
            <div class="controls">
                <button class="btn">▶ Lecture</button>
                <button class="btn secondary">⏸ Pause</button>
                <button class="btn secondary">🔊 Volume</button>
                <button class="btn secondary">⚙️ Paramètres</button>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Port Service</div>
                <div class="info-value">9011</div>
            </div>
            <div class="info-item">
                <div class="info-label">Codec Vidéo</div>
                <div class="info-value">H.265 (HEVC)</div>
            </div>
            <div class="info-item">
                <div class="info-label">Codec Audio</div>
                <div class="info-value">AAC 128 kbps</div>
            </div>
            <div class="info-item">
                <div class="info-label">Framerate</div>
                <div class="info-value">60 fps</div>
            </div>
            <div class="info-item">
                <div class="info-label">Latence</div>
                <div class="info-value">&lt; 2 secondes</div>
            </div>
            <div class="info-item">
                <div class="info-label">Régions</div>
                <div class="info-value">Europe, Asie</div>
            </div>
        </div>
    </div>
</body>
</html>
