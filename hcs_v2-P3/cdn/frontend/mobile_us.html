<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCS CDN - Mobile USA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .header p { font-size: 1.1em; opacity: 0.9; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .stat-label { font-size: 0.9em; opacity: 0.8; margin-bottom: 10px; }
        .stat-value { font-size: 2em; font-weight: bold; color: #a78bfa; }
        .device-preview { background: #000; border-radius: 20px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); max-width: 400px; margin-left: auto; margin-right: auto; }
        .device-screen { width: 100%; aspect-ratio: 9/16; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); }
        .device-icon { font-size: 3em; opacity: 0.5; }
        .controls { display: flex; gap: 10px; padding: 20px; background: rgba(0,0,0,0.3); justify-content: center; flex-wrap: wrap; }
        .btn { padding: 10px 20px; background: #a78bfa; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .btn:hover { background: #c4b5fd; transform: translateY(-2px); }
        .btn.secondary { background: #ec4899; color: #fff; }
        .btn.secondary:hover { background: #db2777; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .info-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; border-left: 3px solid #a78bfa; }
        .info-label { font-size: 0.85em; opacity: 0.7; margin-bottom: 5px; }
        .info-value { font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Mobile USA</h1>
            <p>Service de streaming mobile optimisé pour l'Amérique du Nord</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Résolution</div>
                <div class="stat-value">1080p</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Débit Bitrate</div>
                <div class="stat-value">5 Mbps</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">SLA</div>
                <div class="stat-value">99.9%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Compression</div>
                <div class="stat-value">10:1</div>
            </div>
        </div>

        <div class="device-preview">
            <div class="device-screen">
                <div class="device-icon">📺</div>
            </div>
            <div class="controls">
                <button class="btn">▶ Lecture</button>
                <button class="btn secondary">⏸ Pause</button>
                <button class="btn secondary">🔊 Volume</button>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Port Service</div>
                <div class="info-value">9013</div>
            </div>
            <div class="info-item">
                <div class="info-label">Régions Couvertes</div>
                <div class="info-value">USA, Canada, Mexique</div>
            </div>
            <div class="info-item">
                <div class="info-label">Codec Vidéo</div>
                <div class="info-value">H.264</div>
            </div>
            <div class="info-item">
                <div class="info-label">Codec Audio</div>
                <div class="info-value">AAC 96 kbps</div>
            </div>
            <div class="info-item">
                <div class="info-label">Latence</div>
                <div class="info-value">&lt; 3 secondes</div>
            </div>
            <div class="info-item">
                <div class="info-label">Nœuds Edge</div>
                <div class="info-value">6 emplacements</div>
            </div>
        </div>
    </div>
</body>
</html>
