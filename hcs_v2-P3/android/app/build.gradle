plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.hcs.harmonic'

    defaultConfig {
        applicationId "com.hcs.harmonic"
        minSdk 26           // Android 8.0+ for camera-video API
        targetSdk 34
        versionCode 2
        versionName "2.0-bundle"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
    }

    packaging {
        resources {
            pickFirsts += ['**/libc++_shared.so', '**/libjsc.so']
        }
    }
}

dependencies {
    // ─── Android core ──────────────────────────────────────────────────
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'

    // ─── CameraX (camera2 + video capture) ─────────────────────────────
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"

    // ─── High-quality image processing via Android native RenderScript ──
    // (OpenCV replaced by Android Bitmap + Canvas bicubic – no extra dep)

    // ─── Permissions helpers ────────────────────────────────────────────
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.core:core:1.12.0'

    // ─── Testing ────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
