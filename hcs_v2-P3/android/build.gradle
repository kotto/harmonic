// Top-level build file for HCS Bundle v2.
// Repositories are declared in settings.gradle (FAIL_ON_PROJECT_REPOS mode).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.4.x is compatible with Gradle 8.6
        classpath 'com.android.tools.build:gradle:8.4.0'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
