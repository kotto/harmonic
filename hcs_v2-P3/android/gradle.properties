# Project-wide Gradle settings for HCS Bundle v2.

# JVM memory for Gradle daemon (4GB for 8K processing)
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel execution
org.gradle.parallel=true

# Configuration cache (speeds up builds)
org.gradle.configuration-cache=false

# Gradle build cache
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

# Jetifier (for legacy support libraries)
android.enableJetifier=false

# NOTE: android.enableBuildCache was REMOVED in AGP 7.0+ – do NOT add it back
# Use org.gradle.caching=true instead (Gradle native cache)

# Disable R8 full mode for OpenCV compatibility
android.enableR8.fullMode=false
