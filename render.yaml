services:
  - type: web
    name: ka-mobile
    env: python
    rootDir: engine
    buildCommand: |
      pip install -r requirements.txt
      cd ../ka-mobile-android && npm ci && npm run build
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: VITE_API_URL
        value: https://ka-mobile.onrender.com
      - key: VITAL_API_URL
        value: http://158.178.215.219:8000
      - key: PYTHONUNBUFFERED
        value: "1"
  - type: web
    name: hcv2-pro-www
    env: static
    buildCommand: cd engine && cp -r www/* .
    staticPublishPath: engine/www
    domain: hcv2.pro
  - type: web
    name: hcv2-pro-api
    env: python
    buildCommand: cd engine && pip install -r requirements.txt
    startCommand: ./engine/start_api.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8765
    healthCheckPath: /api/health
