services:
  - type: web
    name: hcv2-pro-www
    env: static
    buildCommand: cd engine && cp -r www/* .
    staticPublishPath: engine/www
    domain: hcv2.pro
  - type: web
    name: hcv2-pro-api
    env: python
    buildCommand: cd engine && pip install -r requirements.txt
    startCommand: cd engine && python hcv2_dashboard/app.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8765
    healthCheckPath: /api/health
