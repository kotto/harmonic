services:
  - type: web
    name: ka-mobile
    env: static
    rootDir: engine/ka-mobile-android
    buildCommand: npm ci && npm run build
    staticPublishPath: www
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api.kamobile.ai
  - type: web
    name: hcv2-pro-www
    env: static
    buildCommand: cd engine && cp -r www/* .
    staticPublishPath: engine/www
    domain: hcv2.pro
  - type: web
    name: hcv2-pro-api
    env: python
    buildCommand: cd engine && pip install -r requirements.txt
    startCommand: ./engine/start_api.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8765
    healthCheckPath: /api/health
