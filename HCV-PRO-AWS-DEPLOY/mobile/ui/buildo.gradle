plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.hcvpro.motion'
    compileSdk 34

    defaultConfig {
        applicationId "com.hcvpro.motion"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // HCV PRO Motion Configuration
        buildConfigField "String", "HCV_PRO_VERSION", "\"1.0.0\""
        buildConfigField "String", "MOTION_ENGINE", "\"KivyMD\""
        buildConfigField "boolean", "ENABLE_PARTICLES", "true"
        buildConfigField "boolean", "ENABLE_AI_ASSISTANT", "true"
        buildConfigField "int", "TARGET_FPS", "60"
        
        vectorDrawables {
            useSupportLibrary true
        }
        
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            buildConfigField "boolean", "DEBUG_MODE", "false"
            
            signingConfigs {
                release {
                    storeFile file('../keystore/hcv_pro_motion.keystore')
                    storePassword 'hcv_pro_2025'
                    keyAlias 'hcv_pro_motion_key'
                    keyPassword 'hcv_pro_key_2025'
                }
            }
            signingConfig signingConfigs.release
        }
        
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            
            buildConfigField "boolean", "DEBUG_MODE", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        
        kotlinOptions {
            jvmTarget = '1.8'
        }
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // HCV PRO Core
    implementation 'org.numpy:numpy:1.24.0'
    implementation 'org.opencv:opencv-android:4.8.0'
    implementation 'com.github.luben:zstd-jni:1.5.5-4@aar'
    
    // Kivy & KivyMD
    implementation 'org.kivy:kivy:2.2.0'
    implementation 'org.kivymd:kivymd:1.2.0'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Material You
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.compose.material3:material3:1.2.0'
    
    // Animation & Motion
    implementation 'com.airbnb.android:lottie:6.1.0'
    implementation 'androidx.transition:transition:1.5.0'
    implementation 'androidx.interpolator:interpolator:1.0.0'
    
    // GPU & Performance
    implementation 'androidx.opengl:opengl:1.0.0'
    implementation 'org.pygame:pygame:2.5.0'
    
    // AI & ML
    implementation 'com.google.ai.client:ai-client:0.3.0'
    implementation 'org.tensorflow:tensorflow-lite:2.13.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.13.0'
    
    // Android Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    
    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    
    // Media & Camera
    implementation 'androidx.camera:camera-camera2:1.3.0'
    implementation 'androidx.camera:camera-lifecycle:1.3.0'
    implementation 'androidx.camera:camera-view:1.3.0'
    
    // Storage & Files
    implementation 'androidx.storage:storage:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.0.0'
    
    // Network & API
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    
    // Permissions
    implementation 'androidx.permission:permission:1.1.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    
    // Debugging
    debugImplementation 'com.facebook.flipper:flipper:0.26.1'
    debugImplementation 'com.facebook.flipper:flipper-network-plugin:0.26.1'
}

// HCV PRO Custom Tasks
task hcvProMotionBuild {
    doLast {
        println "🚀 HCV PRO - Motion Design Build"
        println "Building futuristic mobile interface..."
        println "Features:")
        println("  ✅ KivyMD Material Design")
        println("  ✅ 60 FPS Animations")
        println("  ✅ AI Assistant Integration")
        println("  ✅ HCV PRO Compression")
        println("  ✅ Particle Effects")
        println("  ✅ Material You Colors")
    }
}

// Pre-build task for motion optimization
task optimizeMotionAssets {
    doLast {
        println "🎨 Optimizing motion assets...")
        // Optimize Lottie animations
        // Compress particle textures
        // Generate gradient shaders
    }
}

// Post-build task
task packageHCVProMotion {
    dependsOn 'assembleRelease'
    doLast {
        println "📦 HCV PRO Motion Package Ready!")
        println("APK Location: build/outputs/apk/release/")
        println("Features:")
        println("  🚀 Advanced Compression Engine")
        println("  🤖 AI Assistant with Gemini 4")
        println("  🎨 Futuristic Motion Design")
        println("  ⚡ 60 FPS Performance")
        println("  📱 Material You Adaptative")
        println("  🔋 Battery Optimized")
    }
}

// Hook into build process
preBuild.dependsOn optimizeMotionAssets
assembleRelease.finalizedBy packageHCVProMotion
