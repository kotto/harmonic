<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symphonie Harmonique Moderne - 10 Secondes</title>
<style>
:root{--bg:#020010;--phi:#d4a843;--acc:#3ef0d8;--acc2:#7a5cff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#eaf6ff;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,rgba(212,168,67,0.08),transparent 55%),radial-gradient(ellipse at 50% 70%,rgba(62,240,216,0.04),transparent 60%)}
.container{position:relative;z-index:1;text-align:center;padding:20px}
h1{font-size:1.8em;font-weight:700;background:linear-gradient(135deg,var(--phi),var(--acc2),var(--acc));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.badge{display:inline-block;padding:3px 12px;border-radius:12px;font-size:0.70em;font-weight:700;background:rgba(122,92,255,0.15);color:var(--acc2);margin-bottom:12px;letter-spacing:1px;text-transform:uppercase}
.tagline{font-size:0.90em;color:#b8c6dc;margin-bottom:20px}
.visual{width:320px;height:160px;margin:0 auto 20px;position:relative;background:rgba(15,12,46,0.6);border:1px solid rgba(212,168,67,0.12);border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.visual .psi{font-size:2.5em;font-weight:700;color:var(--phi);opacity:0.25;transition:all 0.8s;z-index:1}
.visual .psi.glow{opacity:1;text-shadow:0 0 80px rgba(212,168,67,0.7),0 0 160px rgba(122,92,255,0.4)}
.wave-bars{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:60px;padding:0 20px;z-index:0}
.wave-bar{width:6px;border-radius:3px 3px 0 0;transition:height 0.15s;opacity:0.5}
.notes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.note-dot{width:32px;height:32px;border-radius:50%;border:1px solid rgba(200,220,255,0.1);background:rgba(10,8,32,0.8);transition:all 0.3s;display:flex;align-items:center;justify-content:center;font-size:0.55em;color:#7a86a8;flex-direction:column;line-height:1}
.note-dot .nh{font-size:1em}.note-dot .ni{font-size:0.6em;opacity:0.6}
.note-dot.lit{box-shadow:0 0 24px currentColor,0 0 48px currentColor;transform:scale(1.25);border-color:currentColor}
.instrument-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;font-size:0.65em;color:#7a86a8}
.inst-tag{padding:2px 8px;border-radius:10px;border:1px solid rgba(200,220,255,0.08);background:rgba(10,8,32,0.6)}
.inst-tag.active{color:#eaf6ff;border-color:currentColor}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:12px 28px;border-radius:28px;border:none;background:linear-gradient(135deg,var(--phi),var(--acc2));color:#fff;font-weight:600;font-size:1em;cursor:pointer;transition:all 0.25s;font-family:inherit}
.btn:hover{opacity:0.85;transform:scale(1.03)}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.progress{width:300px;height:3px;background:rgba(255,255,255,0.06);border-radius:2px;margin:14px auto 0}
.progress .fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--phi),var(--acc2),var(--acc));width:0%;transition:width 0.08s linear}
#statusText{font-size:0.78em;color:#7a86a8;margin-top:6px;min-height:16px;letter-spacing:0.5px}
footer{margin-top:16px;color:#7a86a8;font-size:0.70em}
footer a{color:var(--phi);text-decoration:none}
</style>
</head>
<body>
<canvas id="bgCanvas" style="position:fixed;inset:0;z-index:0;opacity:0.2"></canvas>
<div class="container">
  <div class="badge">Instruments Modernes</div>
  <h1>Symphonie Harmonique</h1>
  <p class="tagline">10 secondes — Synths · Bass · Pad · Lead · Shimmer</p>
  <div class="visual" id="visual">
    <div class="psi" id="psiSymbol">Ψ</div>
    <div class="wave-bars" id="waveBars"></div>
  </div>
  <div class="instrument-row" id="instRow"></div>
  <div class="notes" id="noteDots"></div>
  <div class="btn-row"><button class="btn" id="btnPlay" onclick="play()">▶ Jouer (10s)</button></div>
  <div class="progress"><div class="fill" id="progressFill"></div></div>
  <p id="statusText"></p>
  <footer><a href="index.html">Symphonie Cosmique</a> | <a href="harmoniques-musicales.html">Notes</a></footer>
</div>

<script>
const SCHUMANN=7.83;
const NOTES=[{n:1,val:1.618034,color:'#d4a843',inst:'Pad'},{n:2,val:3.141593,color:'#3ef0d8',inst:'Shimmer'},{n:3,val:2.718282,color:'#7a5cff',inst:'Lead'},{n:4,val:1.414214,color:'#ff6b7a',inst:'Pad'},{n:5,val:1.732051,color:'#f0c96e',inst:'Pluck'},{n:6,val:2.236068,color:'#2ed573',inst:'Lead'},{n:7,val:0.865256,color:'#ffa502',inst:'Bass'}];
function audible(h){let f=SCHUMANN*h;while(f<100)f*=2;while(f>800)f/=2;return f}
const freqs=NOTES.map(n=>({...n,f:audible(n.val)}));freqs.sort((a,b)=>a.f-b.f);

document.getElementById('noteDots').innerHTML=freqs.map(n=>`<div class="note-dot" id="dot-${n.n}" style="color:${n.color}" title="${n.inst}: ${n.f.toFixed(1)} Hz"><span class="nh">H${n.n}</span><span class="ni">${n.f.toFixed(0)}</span></div>`).join('');
document.getElementById('instRow').innerHTML=[...new Set(freqs.map(n=>n.inst))].map(i=>`<span class="inst-tag" id="inst-${i}">${i}</span>`).join('');
const bars=[];const wb=document.getElementById('waveBars');
for(let i=0;i<32;i++){const b=document.createElement('div');b.className='wave-bar';b.style.height='4px';b.style.background=freqs[i%7].color;wb.appendChild(b);bars.push(b)}

let ctx=null,playing=false,oscs=[],masterGain=null,reverbNode=null,delayNode=null;
function init(){
  if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=ctx.createGain();masterGain.gain.value=0.55;masterGain.connect(ctx.destination);
    reverbNode=ctx.createConvolver();const sr=ctx.sampleRate;const len=sr*1.8;
    const imp=ctx.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){const d=imp.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/sr*2.5)*0.5}
    reverbNode.buffer=imp;const wetG=ctx.createGain();wetG.gain.value=0.35;
    masterGain.disconnect();masterGain.connect(ctx.destination);masterGain.connect(reverbNode);reverbNode.connect(wetG);wetG.connect(ctx.destination);
    delayNode=ctx.createDelay(0.35);const fb=ctx.createGain();fb.gain.value=0.22;
    delayNode.connect(fb);fb.connect(delayNode);fb.connect(reverbNode);
    const dryG2=ctx.createGain();dryG2.gain.value=0.5;
    masterGain.connect(dryG2);dryG2.connect(delayNode);
  }
  if(ctx.state==='suspended')ctx.resume()
}

function makeOsc(type,freq,gain,start,dur,panVal){
  const o=ctx.createOscillator();o.type=type;o.frequency.value=freq;
  const g=ctx.createGain();g.gain.value=0;
  const now=ctx.currentTime;
  g.gain.setTargetAtTime(gain,now+start+0.03,0.06);
  g.gain.setTargetAtTime(0,now+start+dur-0.2,0.15);
  const p=ctx.createStereoPanner();p.pan.value=panVal;
  o.connect(g);g.connect(p);p.connect(masterGain);
  o.start(now+start);o.stop(now+start+dur+0.15);oscs.push(o);
  return o;
}

function bassSynth(freq,start,dur,gain=0.18){
  const o1=ctx.createOscillator();o1.type='sawtooth';o1.frequency.value=freq;
  const o2=ctx.createOscillator();o2.type='triangle';o2.frequency.value=freq*0.5;
  const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=380;filt.Q.value=2.8;
  const env=ctx.createGain();env.gain.value=0;const now=ctx.currentTime;
  env.gain.setTargetAtTime(gain,now+start+0.04,0.07);
  env.gain.setTargetAtTime(gain*0.6,now+start+0.4,0.3);
  env.gain.setTargetAtTime(0,now+start+dur-0.25,0.2);
  o1.connect(filt);o2.connect(filt);filt.connect(env);env.connect(masterGain);
  o1.start(now+start);o1.stop(now+start+dur+0.15);oscs.push(o1,o2);
}
function padSynth(freq,start,dur,gain=0.09){
  const now=ctx.currentTime;
  for(let d=-0.12;d<=0.12;d+=0.06){
    const o=makeOsc('sine',freq*(1+d*0.007),gain/4,start+0.15,dur-0.2,d*4);
    const o2=makeOsc('triangle',freq*2*(1+d*0.004),gain/6,start+0.25,dur-0.2,d*3);
  }
}
function leadSynth(freq,start,dur,gain=0.08){
  const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=freq;
  const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=1100;filt.Q.value=1.2;
  const env=ctx.createGain();env.gain.value=0;const now=ctx.currentTime;
  env.gain.setTargetAtTime(gain,now+start+0.02,0.05);
  env.gain.setTargetAtTime(gain*0.25,now+start+0.5,0.35);
  env.gain.setTargetAtTime(0,now+start+dur-0.2,0.25);
  const p=ctx.createStereoPanner();p.pan.value=freq>300?0.35:-0.35;
  o.connect(filt);filt.connect(env);env.connect(p);p.connect(masterGain);
  o.start(now+start);o.stop(now+start+dur+0.15);oscs.push(o);
}
function shimmerSynth(freq,start,dur,gain=0.10){
  const now=ctx.currentTime;
  for(let i=0;i<3;i++){
    const o=makeOsc('sine',freq*(1+i*0.003),gain/3,start+0.1+i*0.14,dur-0.6,(i-1)*0.6);
    o.connect(delayNode);
  }
}
function pluckSynth(freq,start,dur,gain=0.08){
  const o=ctx.createOscillator();o.type='triangle';o.frequency.value=freq;
  const env=ctx.createGain();env.gain.value=0;const now=ctx.currentTime;
  env.gain.setTargetAtTime(gain,now+start+0.01,0.03);
  env.gain.setTargetAtTime(0,now+start+0.22,0.12);
  const p=ctx.createStereoPanner();p.pan.value=freq>250?0.4:-0.4;
  o.connect(env);env.connect(p);p.connect(masterGain);
  o.start(now+start);o.stop(now+start+dur+0.15);oscs.push(o);
  const o2=makeOsc('sine',freq,gain*0.4,start+0.04,0.7,0);o2.connect(reverbNode);
}
function chordSynth(freqsArr,start,dur,gain=0.04){
  freqsArr.forEach(f=>{
    const o=makeOsc('sine',f,gain,start+0.1,dur-0.5,(Math.random()-0.5)*0.6);
  });
}

function light(n,d){const el=document.getElementById('dot-'+n);if(el){el.classList.add('lit');setTimeout(()=>el.classList.remove('lit'),d*1000)}}
function lightInst(i){const el=document.getElementById('inst-'+i);if(el){el.classList.add('active');el.style.color=freqs.find(n=>n.inst===i)?.color||'#fff'}}
function setStatus(t){document.getElementById('statusText').textContent=t}
function animateBars(){
  if(!playing){bars.forEach(b=>b.style.height='4px');return}
  const t=ctx.currentTime;
  bars.forEach((b,i)=>{const h=4+Math.abs(Math.sin(t*3+i*0.3+Math.sin(t*0.7+i)*2))*20*(0.5+0.5*Math.sin(t*0.5+i*0.2));b.style.height=h+'px';b.style.opacity=0.35+0.25*Math.abs(Math.sin(t*2+i*0.4))});
  requestAnimationFrame(animateBars);
}

function play(){
  init();if(playing)return;playing=true;
  const btn=document.getElementById('btnPlay');btn.disabled=true;btn.textContent='♫ En cours...';
  oscs=[];document.getElementById('progressFill').style.width='0%';
  document.getElementById('psiSymbol').classList.add('glow');
  document.querySelectorAll('.inst-tag').forEach(e=>e.classList.remove('active'));
  const T=0.08;setStatus('Phase 1/5 : Bass — L\'Onde Primordiale');
  animateBars();

  bassSynth(freqs[0].f,T+0,3.0,0.22);light(freqs[0].n,3.0);lightInst('Bass');

  setTimeout(()=>{padSynth(freqs[1].f,T+1.5,3.5,0.07);light(freqs[1].n,3.5);lightInst('Pad');},1400);
  setTimeout(()=>{padSynth(freqs[2].f,T+2.0,3.5,0.07);light(freqs[2].n,3.5);setStatus('Phase 2/5 : Pads — La Geometrie s\'eveille');},1900);
  setTimeout(()=>{pluckSynth(freqs[3].f,T+2.5,3.0,0.08);light(freqs[3].n,3.0);lightInst('Pluck');},2400);
  setTimeout(()=>{leadSynth(freqs[4].f,T+3.2,3.5,0.07);light(freqs[4].n,3.5);lightInst('Lead');setStatus('Phase 3/5 : Lead — Les Motifs emergent');},3100);
  setTimeout(()=>{leadSynth(freqs[5].f,T+3.8,3.5,0.07);light(freqs[5].n,3.5);},3700);
  setTimeout(()=>{shimmerSynth(freqs[6].f,T+4.2,3.5,0.10);light(freqs[6].n,3.5);setStatus('Phase 4/5 : Shimmer — L\'Accord Cosmique !');NOTES.forEach(n=>light(n.n,2.5));document.querySelectorAll('.inst-tag').forEach(e=>e.classList.add('active'));},4100);
  setTimeout(()=>{chordSynth(freqs.map(n=>n.f),T+4.5,3.0,0.035);},4400);
  setTimeout(()=>{setStatus('Phase 5/5 : Return to Silence');},6500);
  setTimeout(()=>{bassSynth(freqs[0].f,T+8.2,2.8,0.11);light(freqs[0].n,2.8);},8100);

  const st=Date.now();
  const iv=setInterval(()=>{const p=Math.min(100,(Date.now()-st)/100);document.getElementById('progressFill').style.width=p+'%';if(p>=100)clearInterval(iv)},80);
  setTimeout(()=>{playing=false;btn.disabled=false;btn.textContent='▶ Rejouer (10s)';document.getElementById('psiSymbol').classList.remove('glow');document.querySelectorAll('.inst-tag').forEach(e=>e.classList.remove('active'));setStatus('✨ Symphonie terminee. L\'univers est ne.');document.getElementById('progressFill').style.width='100%';},10500);
}

const cv=document.getElementById('bgCanvas');const cc=cv.getContext('2d');let w=0,h=0;
function rs(){w=cv.width=window.innerWidth;h=cv.height=window.innerHeight}window.addEventListener('resize',rs);rs();
const ps=[];for(let i=0;i<50;i++)ps.push({x:Math.random()*w,y:Math.random()*h,s:Math.random()*1.5+0.3,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,o:Math.random()*0.4+0.1});
function anim(){cc.clearRect(0,0,w,h);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;cc.beginPath();cc.arc(p.x,p.y,p.s,0,Math.PI*2);cc.fillStyle=playing?`rgba(212,168,67,${p.o*1.5})`:`rgba(122,92,255,${p.o})`;cc.fill()});requestAnimationFrame(anim)}anim();
</script>
</body>
</html>
